; Board 1 (sender)   - COM12  MAC a4:cb:8f:d1:ef:58 (Unit A - DHT22 + WiFi hub, IP 10.0.0.48)
; Board 2 (receiver) - COM11  MAC a4:cb:8f:d1:f2:a8 (Unit B - SHT30 on GPIO 8/9)
; Board 3 (unit_c)   - COM14  MAC a4:cb:8f:d1:ef:a0 (Unit C - DHT11 on GPIO 4)

[platformio]
default_envs = sender, receiver, unit_c

[env]
platform                        = espressif32
board                           = esp32-s3-devkitc-1
framework                       = arduino
board_build.flash_size          = 16MB
board_build.partitions          = default_16MB.csv
board_build.arduino.memory_type = qio_opi
board_upload.flash_size         = 16MB
monitor_speed                   = 115200
monitor_dtr                     = 0
monitor_rts                     = 0
extra_scripts                   = pre:auto_port.py

[env:sender]
upload_port  = COM12
monitor_port = COM12
build_flags  = -DROLE_SENDER -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps     = adafruit/DHT sensor library
               adafruit/Adafruit Unified Sensor

[env:receiver]
upload_port  = COM11
monitor_port = COM11
; ESPNOW_CHANNEL must match Unit A's router channel.
; Verify the current channel: GET http://10.0.0.48/rssi -> wifi.ch
build_flags  = -DROLE_RECEIVER -DESPNOW_CHANNEL=11
lib_deps     = adafruit/Adafruit SHT31 Library

[env:unit_c]
upload_port  = COM14
monitor_port = COM14
build_flags  = -DROLE_UNIT_C -DESPNOW_CHANNEL=11
lib_deps     = adafruit/DHT sensor library
               adafruit/Adafruit Unified Sensor
