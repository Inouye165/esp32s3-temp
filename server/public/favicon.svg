<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="32" height="32">
  <!-- Thermometer design in dark theme colors -->
  <rect x="26" y="8" width="12" height="36" rx="6" fill="#1a1a1a" stroke="#7ecfff" stroke-width="2"/>
  <!-- Bulb -->
  <circle cx="32" cy="48" r="10" fill="#ea580c" stroke="#ff6b35" stroke-width="2"/>
  <!-- Mercury column -->
  <rect x="29" y="20" width="6" height="24" rx="3" fill="#ff6b35"/>
  <!-- Temperature marks -->
  <line x1="38" y1="15" x2="42" y2="15" stroke="#7ecfff" stroke-width="1.5"/>
  <line x1="38" y1="22" x2="42" y2="22" stroke="#7ecfff" stroke-width="1.5"/>
  <line x1="38" y1="29" x2="42" y2="29" stroke="#7ecfff" stroke-width="1.5"/>
  <line x1="38" y1="36" x2="42" y2="36" stroke="#7ecfff" stroke-width="1.5"/>
</svg>
