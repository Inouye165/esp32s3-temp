<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ESP32 Mesh Dashboard</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #141414; color: #e0e0e0;
    font-family: "Segoe UI", system-ui, sans-serif;
    display: flex; flex-direction: column; align-items: stretch;
    height: 100vh; overflow: hidden; padding: 12px 16px;
  }
  h1 { font-size: 1.1rem; letter-spacing: .06em; margin-bottom: 10px; color: #fff; }
  
  /* ── tabs ── */
  .tabs {
    display: flex; gap: 4px; margin-bottom: 10px; width: 100%;
    border-bottom: 1px solid #2c2c2c;
  }
  .tab-btn {
    padding: 8px 16px; background: #1a1a1a; border: none; color: #888;
    cursor: pointer; font-size: .85rem; border-radius: 6px 6px 0 0;
    transition: all .15s; border: 1px solid transparent; border-bottom: none;
  }
  .tab-btn:hover { background: #222; color: #aaa; }
  .tab-btn.active {
    background: #252525; color: #7ecfff; font-weight: 600;
    border-color: #2c2c2c; border-bottom: 2px solid #7ecfff;
  }
  .tab-content {
    width: 100%; flex: 1; overflow-y: auto;
    padding: 12px 0;
  }
  .tab-panel { display: none; }
  .tab-panel.active { display: block; }

  /* ── grid ── */
  .grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px; width: 100%;
  }

  /* ── compact status row ── */
  .status-row {
    display: flex; gap: 12px; width: 100%; margin-bottom: 10px;
    flex-wrap: wrap; align-items: center; font-size: .78rem;
  }
  .status-box {
    background: #1a1a1a; border: 1px solid #2c2c2c; border-radius: 8px;
    padding: 8px 12px; display: flex; align-items: center; gap: 8px;
    flex: 1; min-width: 200px;
  }
  .status-label { color: #555; font-size: .7rem; text-transform: uppercase; letter-spacing: .06em; }
  .status-value { color: #7ecfff; font-weight: 600; font-family: monospace; }
  
  /* ── unit card ── */
  .unit {
    background: #1e1e1e; border: 1px solid #2c2c2c; border-radius: 10px;
    padding: 12px; display: flex; flex-direction: column; gap: 8px;
    transition: all .3s ease;
    position: relative;
  }
  .unit.alert {
    background: #2a1a1a;
    border: 2px solid #d97706;
    box-shadow: 0 0 20px rgba(217, 119, 6, 0.3), inset 0 0 30px rgba(217, 119, 6, 0.08);
    animation: alertPulse 2s ease-in-out infinite;
  }
  @keyframes alertPulse {
    0%, 100% { box-shadow: 0 0 20px rgba(217, 119, 6, 0.3), inset 0 0 30px rgba(217, 119, 6, 0.08); }
    50% { box-shadow: 0 0 30px rgba(217, 119, 6, 0.5), inset 0 0 40px rgba(217, 119, 6, 0.12); }
  }
  .unit-alert-banner {
    background: linear-gradient(135deg, #d97706, #ea580c);
    color: #fff;
    padding: 10px 14px;
    border-radius: 8px;
    font-size: .82rem;
    font-weight: 600;
    text-align: center;
    margin-bottom: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    box-shadow: 0 2px 8px rgba(217, 119, 6, 0.4);
  }
  .unit-alert-icon {
    font-size: 1.2rem;
    animation: alertBounce 1s ease-in-out infinite;
  }
  @keyframes alertBounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-3px); }
  }
  .unit-header { display: flex; align-items: center; gap: 10px; }
  .unit-swatch {
    width: 34px; height: 34px; border-radius: 8px;
    border: 1px solid #444; background: #000; flex-shrink: 0;
    transition: background .15s;
  }
  .unit-label { font-weight: 600; font-size: .9rem; }
  .unit-mac { font-size: .65rem; color: #888; letter-spacing: .04em; margin-top: 2px; }
  .unit-ip { font-size: .7rem; color: #5fdb8a; letter-spacing: .03em; margin-top: 2px; font-family: monospace; }
  
  /* ── compact color controls ── */
  .color-toggle {
    background: #252525; border: 1px solid #333; border-radius: 6px;
    padding: 5px 10px; color: #888; font-size: .75rem; cursor: pointer;
    transition: all .15s; display: flex; align-items: center; gap: 6px;
  }
  .color-toggle:hover { background: #2d2d2d; color: #aaa; }
  .color-toggle-indicator {
    width: 16px; height: 16px; border-radius: 4px; border: 1px solid #444;
  }
  .color-section {
    max-height: 0; overflow: hidden; transition: max-height .3s ease;
  }
  .color-section.open {
    max-height: 150px;
  }

  /* ── colour picker ── */
  .picker-row { display: flex; align-items: center; gap: 10px; }
  .picker-row input[type=color] {
    width: 48px; height: 40px; border: none; border-radius: 6px;
    cursor: pointer; background: none; padding: 0;
  }
  .hex-input {
    flex: 1; background: #2a2a2a; border: 1px solid #3a3a3a; color: #e0e0e0;
    border-radius: 6px; padding: 6px 10px; font-size: .9rem; font-family: monospace;
  }
  .hex-input:focus { outline: none; border-color: #666; }

  /* ── mode radio ── */
  .mode-row { display: flex; gap: 14px; font-size: .85rem; }
  .mode-row label { display: flex; align-items: center; gap: 5px; cursor: pointer; }

  /* ── send button ── */
  .send-btn {
    width: 100%; padding: 9px; border: none; border-radius: 8px;
    background: #2d5af5; color: #fff; font-weight: 600; font-size: .95rem;
    cursor: pointer; transition: background .15s;
  }
  .send-btn:hover:not(:disabled) { background: #4068ff; }
  .send-btn:disabled { opacity: .45; cursor: default; }

  /* ── off button ── */
  .off-btn {
    width: 100%; padding: 9px; border: none; border-radius: 8px;
    background: #3a3a3a; color: #e0e0e0; font-weight: 600; font-size: .95rem;
    cursor: pointer; transition: background .15s;
  }
  .off-btn:hover:not(:disabled) { background: #4a4a4a; }
  .off-btn:disabled { opacity: .45; cursor: default; }

  /* ── status ── */
  .status {
    font-size: .78rem; min-height: 1.1em; padding: 4px 8px;
    border-radius: 5px; transition: background .2s;
  }
  .status.ok  { color: #5fdb8a; background: #0d2b1a; }
  .status.err { color: #f07070; background: #2b0f0f; }

  /* ── temp badge ── */
  .temp-badge {
    background: #202020; border: 1px solid #2c2c2c; border-radius: 8px;
    padding: 10px 14px; display: flex; gap: 18px; font-size: .88rem;
    align-items: center; flex-wrap: wrap;
  }
  .temp-badge .lbl { color: #888; font-size: .72rem; margin-bottom: 1px; text-transform: uppercase; }
  .temp-badge .val { font-size: 1.2rem; font-weight: 700; color: #7ecfff; }
  .temp-badge .hum .val { color: #9de87a; }
  .temp-badge .age-txt { font-size: .7rem; color: #555; margin-top: 3px; }
  .temp-badge .no-data { color: #555; font-style: italic; font-size: .82rem; }

  /* ── offset row ── */
  .offset-row {
    display: flex; align-items: center; gap: 6px;
    font-size: .75rem; color: #666;
  }
  .offset-row input[type=number] {
    width: 62px; background: #252525; border: 1px solid #333; color: #aaa;
    border-radius: 4px; padding: 3px 6px; font-size: .75rem;
    -moz-appearance: textfield;
  }
  .offset-row input[type=number]::-webkit-outer-spin-button,
  .offset-row input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; }

  /* ── signal panel ── */
  .signal-panel {
    background: #1a1a1a; border: 1px solid #2c2c2c; border-radius: 8px;
    padding: 8px 12px; flex: 1; min-width: 300px;
  }
  .panel-title {
    font-size: .7rem; color: #555; letter-spacing: .08em;
    text-transform: uppercase; margin-bottom: 6px;
    display: flex; align-items: center; gap: 6px;
  }
  .ws-dot {
    width: 6px; height: 6px; border-radius: 50%;
    display: inline-block; transition: background .4s;
  }
  .ws-dot.connected    { background: #4ade80; box-shadow: 0 0 5px #4ade8099; }
  .ws-dot.disconnected { background: #555; }

  .signal-rows { display: flex; gap: 12px; flex-wrap: wrap; }
  .signal-row {
    display: flex; align-items: center; gap: 6px; font-size: .75rem;
  }
  .signal-row-label { color: #888; min-width: 50px; }
  .signal-bars { display: flex; align-items: flex-end; gap: 2px; height: 16px; }
  .bar {
    border-radius: 2px; background: #333; transition: background .35s;
    flex-shrink: 0;
  }
  .bar-1 { width: 5px; height:  4px; }
  .bar-2 { width: 5px; height:  6px; }
  .bar-3 { width: 5px; height:  8px; }
  .bar-4 { width: 5px; height: 12px; }
  .bar-5 { width: 5px; height: 14px; }
  .signal-dbm  { font-size: .75rem; font-weight: 600; font-family: monospace; }
  .signal-qual { font-size: .68rem; color: #666; }

  /* ── sensor chip ── */
  .unit-sensor-chip {
    font-size: .68rem; color: #5fdb8a; background: #0d2b1a;
    border-radius: 4px; padding: 2px 7px; letter-spacing: .04em;
    display: inline-block; margin-top: 3px;
  }
  .unit-role-chip {
    font-size: .62rem; color: #7ecfff; background: #102538;
    border-radius: 4px; padding: 2px 7px; letter-spacing: .08em;
    display: inline-block; margin-left: 6px; text-transform: uppercase; font-weight: 600;
  }
  .unit-meta { display: flex; flex-direction: column; gap: 2px; margin-top: 4px; }
  .unit-meta-row { font-size: .72rem; color: #888; font-family: monospace; display: flex; gap: 6px; align-items: center; }
  .unit-meta-label { color: #555; min-width: 36px; }
  .unit-meta-val { color: #aaa; }
  .unit-meta-val.ip { color: #5fdb8a; }
  .unit-meta-val.transport { color: #7ecfff; }

  /* ── sync panel ── */
  .sync-panel {
    background: #1a1a1a; border: 1px solid #2c2c2c; border-radius: 8px;
    padding: 8px 12px; flex: 1; min-width: 300px;
  }
  .sync-rows { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
  .sync-row {
    display: flex; align-items: center; gap: 8px;
  }
  .sync-check { display: flex; align-items: center; gap: 6px; cursor: pointer; font-size: .75rem; }
  .sync-check input[type=checkbox] { width: 14px; height: 14px; cursor: pointer; accent-color: #2d5af5; }
  .sync-check input[type=checkbox]:disabled { cursor: not-allowed; }
  .sync-unit-name { font-weight: 600; color: #ccc; }
  .sync-sensor-tag {
    font-size: .65rem; color: #5fdb8a; background: #0d2b1a;
    border-radius: 4px; padding: 2px 6px; letter-spacing: .04em;
  }
  .sync-disp-temp { font-size: .85rem; font-weight: 600; color: #7ecfff; font-family: monospace; }
  .sync-btn {
    padding: 6px 12px; border: 1px solid #2d7a3e; border-radius: 6px;
    background: #1d4e2a; color: #5fdb8a; font-weight: 600; font-size: .75rem;
    cursor: pointer; transition: background .15s;
  }
  .sync-btn:hover:not(:disabled) { background: #25623a; }
  .sync-btn:disabled { opacity: .4; cursor: default; }
  .sync-hint { font-size: .68rem; color: #555; }

  /* ── log ── */
  .log-wrap {
    width: 100%; background: #1a1a1a; border: 1px solid #2c2c2c; border-radius: 8px;
    padding: 12px; height: calc(100vh - 180px); overflow: hidden; display: flex; flex-direction: column;
  }
  .log-title { font-size: .7rem; color: #555; margin-bottom: 8px; letter-spacing: .08em; text-transform: uppercase; }
  .log-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 2px; }
  .log-entry { font-size: .72rem; color: #888; font-family: monospace; }
  .log-entry .ts  { color: #555; }
  .log-entry.ok  .msg { color: #5fdb8a; }
  .log-entry.err .msg { color: #f07070; }

  /* ── temperature graph ── */
  .temp-graph-panel {
    width: 100%; background: #1a1a1a; border: 1px solid #2c2c2c; border-radius: 8px;
    padding: 20px; height: calc(100vh - 180px); overflow: hidden; display: flex; flex-direction: column;
  }
  .temp-graph-title {
    font-size: .7rem; color: #555; letter-spacing: .08em;
    text-transform: uppercase; margin-bottom: 8px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .temp-graph-controls {
    display: flex; gap: 6px; font-size: .72rem;
  }
  .temp-graph-btn {
    padding: 4px 8px; border: 1px solid #333; border-radius: 5px;
    background: #252525; color: #aaa; cursor: pointer;
    transition: all .15s;
  }
  .temp-graph-btn:hover { background: #2d2d2d; border-color: #444; }
  .temp-graph-btn.active {
    background: #2d5af5; color: #fff; border-color: #2d5af5;
  }
  .temp-graph-canvas {
    flex: 1; width: 100%; position: relative;
  }
  .temp-graph-loading {
    display: flex; align-items: center; justify-content: center;
    height: 100%; color: #555; font-size: .85rem;
  }

  /* ── calibration panel ── */
  .cal-panel {
    width: 100%; background: #1a1a1a; border: 1px solid #2c2c2c; border-radius: 8px;
    padding: 20px; overflow-y: auto; max-height: calc(100vh - 180px);
  }
  .cal-section {
    margin-bottom: 24px; padding-bottom: 24px; border-bottom: 1px solid #2c2c2c;
  }
  .cal-section:last-child { border-bottom: none; margin-bottom: 0; }
  .cal-section-title {
    font-size: .85rem; color: #aaa; letter-spacing: .06em;
    margin-bottom: 12px; font-weight: 600; display: flex; align-items: center; gap: 8px;
  }
  .cal-form {
    display: grid; gap: 12px; max-width: 600px;
  }
  .cal-form-row {
    display: flex; gap: 10px; align-items: center;
  }
  .cal-label {
    min-width: 120px; font-size: .8rem; color: #888;
  }
  .cal-input {
    flex: 1; background: #252525; border: 1px solid #333; color: #e0e0e0;
    border-radius: 6px; padding: 8px 12px; font-size: .85rem;
  }
  .cal-input:focus { outline: none; border-color: #2d5af5; }
  .cal-input[type=datetime-local] { font-family: monospace; }
  .cal-hint {
    font-size: .7rem; color: #666; margin-top: 4px; font-style: italic;
  }
  .cal-btn {
    padding: 10px 18px; border: 1px solid #2d5af5; border-radius: 6px;
    background: #2d5af5; color: #fff; font-weight: 600; font-size: .85rem;
    cursor: pointer; transition: all .15s;
  }
  .cal-btn:hover:not(:disabled) { background: #4068ff; }
  .cal-btn:disabled { opacity: .4; cursor: not-allowed; }
  .cal-btn-secondary {
    background: #252525; border-color: #444; color: #aaa;
  }
  .cal-btn-secondary:hover:not(:disabled) { background: #2d2d2d; }
  .cal-btn-danger {
    background: #8b0000; border-color: #8b0000; color: #fff;
  }
  .cal-btn-danger:hover:not(:disabled) { background: #a00000; }
  
  .cal-sessions {
    display: flex; flex-direction: column; gap: 10px;
  }
  .cal-session-card {
    background: #252525; border: 1px solid #333; border-radius: 6px;
    padding: 12px 16px; display: flex; justify-content: space-between; align-items: center;
  }
  .cal-session-info {
    display: flex; flex-direction: column; gap: 4px;
  }
  .cal-session-name {
    font-size: .9rem; font-weight: 600; color: #e0e0e0;
  }
  .cal-session-meta {
    font-size: .72rem; color: #888; font-family: monospace;
  }
  .cal-session-ref {
    font-size: .75rem; color: #7ecfff; margin-top: 2px;
  }
  .cal-session-actions {
    display: flex; gap: 6px;
  }
  
  .cal-coeffs {
    display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
  }
  .cal-coeff-card {
    background: #252525; border: 1px solid #333; border-radius: 6px;
    padding: 14px; display: flex; flex-direction: column; gap: 6px;
  }
  .cal-coeff-title {
    font-size: .9rem; font-weight: 600; color: #e0e0e0; margin-bottom: 4px;
  }
  .cal-coeff-row {
    display: flex; justify-content: space-between; align-items: center;
    font-size: .75rem;
  }
  .cal-coeff-label { color: #888; }
  .cal-coeff-value { color: #7ecfff; font-family: monospace; }
  .cal-coeff-rmse { color: #5fdb8a; }
  
  .cal-preview {
    background: #252525; border: 1px solid #333; border-radius: 6px;
    padding: 12px; margin-top: 10px; display: grid; gap: 8px;
    grid-template-columns: repeat(3, 1fr);
  }
  .cal-preview-unit {
    display: flex; flex-direction: column; gap: 4px;
  }
  .cal-preview-label {
    font-size: .7rem; color: #888; text-transform: uppercase;
  }
  .cal-preview-value {
    font-size: 1rem; font-weight: 600; color: #7ecfff; font-family: monospace;
  }
  .cal-preview-range {
    font-size: .65rem; color: #666;
  }
  
  .cal-empty {
    color: #666; font-size: .8rem; font-style: italic; padding: 20px; text-align: center;
  }
</style>
</head>
<body>
<h1>ESP32 Mesh Dashboard <span style="font-size:.7em;color:#666;font-weight:400;">· 3 units</span></h1>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useReducer, useRef } = React;

// ── state ─────────────────────────────────────────────────────────────────────
const INIT = {
  rssi:        { wifi: null, b: null, c: null },
  colors:      { a: '#ff0000', b: '#ff0000', c: '#ff0000' },
  modeB:       'match',
  modeC:       'match',
  tempA:       null,
  tempB:       null,
  tempC:       null,
  tempHistory: [],
  log:         [],
  info:        {},
  wsConnected: false,
  unitAReachable: true,
};

function reducer(s, a) {
  switch (a.type) {
    case 'RSSI':      return { ...s, rssi: a.data };
    case 'COLOR':      return { ...s, colors: { ...s.colors, [a.unit]: a.hex } };
    case 'SET_COLORS': return { ...s, colors: { ...s.colors, ...a.updates } };
    case 'MODE_B': {
      const colors = a.mode === 'match' ? { ...s.colors, b: s.colors.a } : s.colors;
      return { ...s, modeB: a.mode, colors };
    }
    case 'MODE_C': {
      const colors = a.mode === 'match' ? { ...s.colors, c: s.colors.a } : s.colors;
      return { ...s, modeC: a.mode, colors };
    }
    case 'TEMP_A': return { ...s, tempA: a.data };
    case 'TEMP_B': return { ...s, tempB: a.data };
    case 'TEMP_C': return { ...s, tempC: a.data };
    case 'TEMP_HISTORY': return { ...s, tempHistory: a.data };
    case 'LOG':    return { ...s, log: [a.entry, ...s.log].slice(0, 80) };
    case 'INFO':   return { ...s, info: a.data };
    case 'WS':     return { ...s, wsConnected: a.ok };
    case 'UNIT_A_REACHABLE': return { ...s, unitAReachable: a.reachable };
    default:       return s;
  }
}

// ── helpers ───────────────────────────────────────────────────────────────────
function hexToRgb(hex) {
  return {
    r: parseInt(hex.slice(1, 3), 16),
    g: parseInt(hex.slice(3, 5), 16),
    b: parseInt(hex.slice(5, 7), 16),
  };
}
function rssiToBars(rssi) {
  if (rssi == null) return 0;
  if (rssi >= -55)  return 5;
  if (rssi >= -65)  return 4;
  if (rssi >= -75)  return 3;
  if (rssi >= -85)  return 2;
  return 1;
}
function rssiColor(rssi) {
  if (rssi == null) return '#555';
  if (rssi >= -65)  return '#4ade80';   /* green    */
  if (rssi >= -75)  return '#facc15';   /* yellow   */
  if (rssi >= -85)  return '#fb923c';   /* orange   */
  return '#f87171';                      /* red      */
}
function rssiQual(rssi) {
  if (rssi == null) return 'no data';
  if (rssi >= -65)  return 'excellent';
  if (rssi >= -75)  return 'good';
  if (rssi >= -85)  return 'fair';
  return 'poor';
}

// ── WebSocket hook ────────────────────────────────────────────────────────────
function useRssiWS(dispatch) {
  const wsRef    = useRef(null);
  const timerRef = useRef(null);

  useEffect(() => {
    function connect() {
      const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
      const ws = new WebSocket(proto + '//' + location.host);
      wsRef.current = ws;

      ws.onopen  = () => dispatch({ type: 'WS', ok: true });
      ws.onclose = () => {
        dispatch({ type: 'WS', ok: false });
        timerRef.current = setTimeout(connect, 3000);
      };
      ws.onerror   = () => ws.close();
      ws.onmessage = e => {
        try {
          const msg = JSON.parse(e.data);
          if (msg.type === 'rssi') {
            dispatch({ type: 'RSSI', data: msg.data });
          } else if (msg.type === 'temperature') {
            // New temperature reading logged - refresh history
            // We'll trigger a fetch in the component that listens for this
            console.log('[ws] New temperature reading logged', msg.data);
          }
        } catch (_) {}
      };
    }
    connect();
    return () => {
      clearTimeout(timerRef.current);
      if (wsRef.current) wsRef.current.close();
    };
  }, [dispatch]);
}

// ── TempBadge ─────────────────────────────────────────────────────────────────
function TempBadge({ data, offset = 0, unitId, calibratedTempC }) {
  if (!data) {
    return (
      <div className="temp-badge">
        <span className="no-data">Waiting for temperature…</span>
      </div>
    );
  }
  if (data.temp_c <= -99) {
    return (
      <div className="temp-badge">
        <span className="no-data" style={{color:'#ea580c'}}>⚠ Sensor error — unit online, sensor not responding</span>
      </div>
    );
  }
  
  const rawF = (data.temp_c * 9 / 5 + 32).toFixed(1);
  const displayF = ((data.temp_c * 9 / 5 + 32) + offset).toFixed(1);
  const age = data.age < 60 ? data.age + ' s ago' : Math.floor(data.age / 60) + ' min ago';
  
  // If calibration is available, show calibrated value
  const hasCal = calibratedTempC !== null && calibratedTempC !== undefined && calibratedTempC !== data.temp_c;
  const calF = hasCal ? (calibratedTempC * 9 / 5 + 32).toFixed(1) : null;
  
  return (
    <div className="temp-badge">
      <div>
        <div className="lbl">Temp</div>
        <div className="val">{displayF} °F</div>
        {hasCal && (
          <div style={{ fontSize: '.7rem', color: '#5fdb8a', marginTop: '2px' }}>
            📐 Cal: {calF} °F
          </div>
        )}
      </div>
      <div className="hum">
        <div className="lbl">Humidity</div>
        <div className="val">{data.humidity} %</div>
      </div>
      <div><div className="age-txt">{age}</div></div>
    </div>
  );
}

// ── SyncPanel ───────────────────────────────────────────────────────────────────
const UNIT_SENSORS = { a: 'DHT22', b: 'SHT30', c: 'DHT11' };

function SyncPanel({ tempA, tempB, tempC, offsets, includes, onToggle, onSync }) {
  const units = [
    { key: 'a', label: 'Unit A', sensor: UNIT_SENSORS.a, data: tempA },
    { key: 'b', label: 'Unit B', sensor: UNIT_SENSORS.b, data: tempB },
    { key: 'c', label: 'Unit C', sensor: UNIT_SENSORS.c, data: tempC },
  ];
  const hasEnough = units.filter(u => includes[u.key] && u.data).length >= 2;
  return (
    <div className="sync-panel">
      <div className="panel-title">Temperature Calibration Sync</div>
      <div className="sync-rows">
        {units.map(u => {
          const rawF = u.data ? (u.data.temp_c * 9/5 + 32) : null;
          const displayed = rawF !== null ? (rawF + (offsets[u.key] || 0)).toFixed(1) + ' °F' : '—';
          return (
            <div key={u.key} className="sync-row">
              <label className="sync-check">
                <input type="checkbox" checked={includes[u.key]}
                       onChange={() => onToggle(u.key)}
                       disabled={!u.data} />
                <span className="sync-unit-name">{u.label}</span>
                <span className="sync-sensor-tag">{u.sensor}</span>
              </label>
              <span className="sync-disp-temp">{displayed}</span>
            </div>
          );
        })}
      </div>
      <button className="sync-btn" disabled={!hasEnough} onClick={onSync}>
        Sync to Average
      </button>
      <div className="sync-hint">
        Adjusts offsets so all included units display the same temperature.
      </div>
    </div>
  );
}

function ColorPicker({ hex, onChange, disabled }) {
  const [local, setLocal] = useState(hex);
  useEffect(() => setLocal(hex), [hex]);

  function onPicker(e) { setLocal(e.target.value); onChange(e.target.value); }
  function onText(e) {
    const v = e.target.value;
    setLocal(v);
    if (/^#[0-9a-f]{6}$/i.test(v)) onChange(v);
  }
  return (
    <div className="picker-row" style={disabled ? { opacity: .4, pointerEvents: 'none' } : {}}>
      {/* color input always reflects parent state immediately; text input uses local state for smooth typing */}
      <input type="color" value={hex} onChange={onPicker} />
      <input type="text" className="hex-input" value={local} onChange={onText} maxLength={7} />
    </div>
  );
}
