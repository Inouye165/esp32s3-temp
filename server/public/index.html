  }

  function handleColorA(hex) {
    const updates = { a: hex };
    if (state.modeB === 'match') updates.b = hex;
    if (state.modeC === 'match') updates.c = hex;
    dispatch({ type: 'SET_COLORS', updates });
  }

  const { rssi, colors, modeB, modeC, tempA, tempB, tempC, log, info, wsConnected, unitAReachable } = state;

  const canSync = () => {
    const rawFs = {
      a: tempA ? (tempA.temp_c * 9/5 + 32) : null,
      b: tempB ? (tempB.temp_c * 9/5 + 32) : null,
      c: tempC ? (tempC.temp_c * 9/5 + 32) : null,
    };
    const included = ['a','b','c'].filter(u => syncIncludes[u] && rawFs[u] !== null);
    return included.length >= 2;
  };

  const renderSignalRow = (label, val) => {
    if (val === null || val === undefined) {
      return (
        <div className="signal-row" key={label}>
          <span className="signal-row-label">{label}</span>
          <div className="signal-bars">
            {[1,2,3,4,5].map(i => <div key={i} className={'bar bar-'+i} style={{background:'#222'}} />)}
          </div>
          <span className="signal-dbm" style={{color:'#555'}}>—</span>
          <span className="signal-qual" style={{color:'#555'}}>no data</span>
        </div>
      );
    }
    const dbm = (typeof val === 'object' && val.rssi !== undefined) ? val.rssi : val;
    let quality = 'excellent', color = '#4ade80';
    if (dbm >= -50) { quality = 'excellent'; color = '#4ade80'; }
    else if (dbm >= -60) { quality = 'good'; color = '#5fdb8a'; }
    else if (dbm >= -70) { quality = 'fair'; color = '#facc15'; }
    else { quality = 'weak'; color = '#ea580c'; }
    
    const filled = rssiToBars(dbm);
    
    return (
      <div className="signal-row" key={label}>
        <span className="signal-row-label">{label}</span>
        <div className="signal-bars">
          {[1, 2, 3, 4, 5].map(i => (
            <div key={i} className={'bar bar-' + i}
                 style={{ background: i <= filled ? color : '#222' }} />
          ))}
        </div>
        <span className="signal-dbm" style={{ color }}>{dbm} dBm</span>
        <span className="signal-qual" style={{ color }}>{quality}</span>
      </div>
    );
  };

  return (
    <>
      <header>
        <div className="header-title-group">
          <h1>
            <span className="material-symbols-outlined" style={{fontSize: '28px', color: 'var(--md-sys-color-primary)'}}>mesh</span>
            ESP32 Mesh Temperature System
          </h1>
          <div className="header-subtitle">
            <span className="material-symbols-outlined" style={{fontSize:'14px'}}>sensors</span>
            <span>3 colocated monitors reading synchronously</span>
          </div>
        </div>
      </header>

      {/* ── TABS ── */}
      <div className="tabs">
        <button 
          className={'tab-btn' + (activeTab === 'controls' ? ' active' : '')}
          onClick={() => setActiveTab('controls')}
        >
          <span className="material-symbols-outlined" style={{fontSize: '18px'}}>dashboard</span>
          Dashboard
        </button>
        <button 
          className={'tab-btn' + (activeTab === 'graph' ? ' active' : '')}
          onClick={() => setActiveTab('graph')}
        >
          <span className="material-symbols-outlined" style={{fontSize: '18px'}}>monitoring</span>
          History Graph
        </button>
        <button 
          className={'tab-btn' + (activeTab === 'calibration' ? ' active' : '')}
          onClick={() => setActiveTab('calibration')}
        >
          <span className="material-symbols-outlined" style={{fontSize: '18px'}}>settings_accessibility</span>
          Calibration Curve
        </button>
        <button 
          className={'tab-btn' + (activeTab === 'log' ? ' active' : '')}
          onClick={() => setActiveTab('log')}
        >
          <span className="material-symbols-outlined" style={{fontSize: '18px'}}>receipt_long</span>
          Logs
        </button>
      </div>

      {/* ── TAB CONTENT ── */}
      <div className="tab-content">
        
        {/* ── CONTROLS TAB ── */}
        <div className={'tab-panel' + (activeTab === 'controls' ? ' active' : '')}>
          
          <div className="status-row">
            <div className="sync-panel">
              <div className="panel-title">
                <span>Synchronized Offsets</span>
                <span className="sync-sensor-tag" style={{fontSize:'0.65rem'}}>Fahrenheit</span>
              </div>
              <div className="sync-rows">
                <div className="sync-row">
                  <label className="sync-check">
                    <input
                      type="checkbox"
                      checked={syncIncludes.a}
                      disabled={!tempA}
                      onChange={() => toggleSyncInclude('a')}
                    />
                    <span className="sync-unit-name">Unit A</span>
                    <span className="sync-sensor-tag">{info.unitA ? info.unitA.sensor : 'DHT22'}</span>
                  </label>
                  <span className="sync-disp-temp">
                    {tempA && tempA.temp_c != null ? ((tempA.temp_c * 9/5 + 32) + (offsets.a || 0)).toFixed(1) + ' °F' : '—'}
                  </span>
                </div>
                <div className="sync-row">
                  <label className="sync-check">
                    <input
                      type="checkbox"
                      checked={syncIncludes.b}
                      disabled={!tempB}
                      onChange={() => toggleSyncInclude('b')}
                    />
                    <span className="sync-unit-name">Unit B</span>
                    <span className="sync-sensor-tag">{info.unitB ? info.unitB.sensor : 'SHT30'}</span>
                  </label>
                  <span className="sync-disp-temp">
                    {tempB && tempB.temp_c != null ? ((tempB.temp_c * 9/5 + 32) + (offsets.b || 0)).toFixed(1) + ' °F' : '—'}
                  </span>
                </div>
                <div className="sync-row">
                  <label className="sync-check">
                    <input
                      type="checkbox"
                      checked={syncIncludes.c}
                      disabled={!tempC}
                      onChange={() => toggleSyncInclude('c')}
                    />
                    <span className="sync-unit-name">Unit C</span>
                    <span className="sync-sensor-tag">{info.unitC ? info.unitC.sensor : 'DHT11'}</span>
                  </label>
                  <span className="sync-disp-temp">
                    {tempC && tempC.temp_c != null ? ((tempC.temp_c * 9/5 + 32) + (offsets.c || 0)).toFixed(1) + ' °F' : '—'}
                  </span>
                </div>
                <div className="sync-controls">
                  <button className="m-btn m-btn-primary" onClick={syncToAverage} disabled={!canSync()}>
                    Align Offsets
                  </button>
                  <div className="sync-hint">
                    Equalizes temperature readouts to their collective average.
                  </div>
                </div>
              </div>
            </div>
            
            <SignalPanel rssi={rssi} wsConnected={wsConnected} />
          </div>

          {/* Unit cards */}
          <div className="grid">

            {/* ── UNIT A ── */}
            <div className="m-card unit">
              <div className="unit-header">
                <div className="unit-swatch" style={{ background: colors.a }} />
                <div className="unit-title-group">
                  <div className="unit-label">
                    Unit A
                    <span className="unit-role-chip">{info.unitA ? info.unitA.role : 'hub'}</span>
                  </div>
                  <div className="unit-sensor-chip">{info.unitA ? info.unitA.sensor : 'DHT22'}</div>
                </div>
              </div>
              
              <div className="unit-meta">
                <div className="unit-meta-row"><span className="unit-meta-label">MAC</span><span className="unit-meta-val">{info.unitA ? info.unitA.mac : '—'}</span></div>
                {info.unitA && info.unitA.ip && <div className="unit-meta-row"><span className="unit-meta-label">IP Address</span><span className="unit-meta-val ip">{info.unitA.ip}</span></div>}
                {info.unitA && info.unitA.port && <div className="unit-meta-row"><span className="unit-meta-label">COM Port</span><span className="unit-meta-val">{info.unitA.port}</span></div>}
                {info.unitA && info.unitA.transport && <div className="unit-meta-row"><span className="unit-meta-label">Link</span><span className="unit-meta-val transport">{info.unitA.transport}</span></div>}
              </div>
              
              <div className="color-control-box">
                <div 
                  className="color-toggle" 
                  onClick={() => setColorExpanded(prev => ({ ...prev, a: !prev.a }))}
                >
                  <div className="color-toggle-indicator" style={{ background: colors.a }} />
                  <span>LED Node Control</span>
                  <span style={{ marginLeft: 'auto' }} className="material-symbols-outlined">
                    {colorExpanded.a ? 'expand_less' : 'expand_more'}
                  </span>
                </div>
                
                <div className={'color-section' + (colorExpanded.a ? ' open' : '')}>
                  <ColorPicker hex={colors.a} onChange={handleColorA} disabled={false} />
                  <div className="picker-actions">
                    <button className="m-btn m-btn-primary" disabled={busyA} onClick={handleSendA}>
                      Apply Color
                    </button>
                    <button className="m-btn m-btn-secondary" disabled={busyA} onClick={() => sendColor('a', 0, 0, 0, setBusyA, setStatusA)}>
                      Off
                    </button>
                  </div>
                  {statusA && (
                    <div className={'status-badge ' + (statusA.ok ? 'ok' : 'err')}>
                      {statusA.msg}
                    </div>
                  )}
                </div>
              </div>
              
              <TempBadge 
                data={tempA} 
                offset={offsets.a} 
                unitId="a"
                calibratedTempC={tempA ? applyCalibratedTemp('a', tempA.temp_c) : null}
              />
              <TempOffset value={offsets.a} onChange={v => setOffset('a', v)} />
            </div>

            {/* ── UNIT B ── */}
            <div className={`m-card unit ${!unitAReachable ? 'alert' : ''}`}>
              {!unitAReachable && (
                <div className="unit-alert-banner">
                  <span className="material-symbols-outlined" style={{fontSize:'16px'}}>warning</span>
                  <span>Unit A Offline</span>
                </div>
              )}
              <div className="unit-header">
                <div className="unit-swatch" style={{ background: colors.b }} />
                <div className="unit-title-group">
                  <div className="unit-label">
                    Unit B
                    <span className="unit-role-chip">{info.unitB ? info.unitB.role : 'sensor'}</span>
                  </div>
                  <div className="unit-sensor-chip">{info.unitB ? info.unitB.sensor : 'SHT30'}</div>
                </div>
              </div>

              <div className="unit-meta">
                <div className="unit-meta-row"><span className="unit-meta-label">MAC</span><span className="unit-meta-val">{info.unitB ? info.unitB.mac : '—'}</span></div>
                {info.unitB && info.unitB.port && <div className="unit-meta-row"><span className="unit-meta-label">COM Port</span><span className="unit-meta-val">{info.unitB.port}</span></div>}
                {info.unitB && info.unitB.transport && <div className="unit-meta-row"><span className="unit-meta-label">Link</span><span className="unit-meta-val transport">{info.unitB.transport}</span></div>}
              </div>

              <div className="mode-row">
                <label style={{display:'flex', alignItems:'center', gap:'4px', cursor:'pointer'}}>
                  <input type="radio" name="modeB" value="match"
                         checked={modeB === 'match'}
                         onChange={() => dispatch({ type: 'MODE_B', mode: 'match' })}
                         style={{accentColor: 'var(--md-sys-color-primary)'}} />
                  <span>Match Unit A</span>
                </label>
                <label style={{display:'flex', alignItems:'center', gap:'4px', cursor:'pointer'}}>
                  <input type="radio" name="modeB" value="independent"
                         checked={modeB === 'independent'}
                         onChange={() => dispatch({ type: 'MODE_B', mode: 'independent' })}
                         style={{accentColor: 'var(--md-sys-color-primary)'}} />
                  <span>Independent</span>
                </label>
              </div>
              
              <div className="color-control-box">
                <div 
                  className="color-toggle" 
                  onClick={() => setColorExpanded(prev => ({ ...prev, b: !prev.b }))}
                >
                  <div className="color-toggle-indicator" style={{ background: colors.b }} />
                  <span>LED Node Control</span>
                  <span style={{ marginLeft: 'auto' }} className="material-symbols-outlined">
                    {colorExpanded.b ? 'expand_less' : 'expand_more'}
                  </span>
                </div>
                
                <div className={'color-section' + (colorExpanded.b ? ' open' : '')}>
                  <ColorPicker hex={colors.b}
                               onChange={hex => dispatch({ type: 'COLOR', unit: 'b', hex })}
                               disabled={modeB === 'match'} />
                  <div className="picker-actions">
                    <button className="m-btn m-btn-primary"
                            disabled={busyB || modeB === 'match'}
                            onClick={() => { const {r,g,b} = hexToRgb(colors.b); sendColor('b',r,g,b,setBusyB,setStatusB); }}>
                      Apply Color
                    </button>
                    <button className="m-btn m-btn-secondary"
                            disabled={busyB || modeB === 'match'}
                            onClick={() => sendColor('b', 0, 0, 0, setBusyB, setStatusB)}>
                      Off
                    </button>
                  </div>
                  {statusB && (
                    <div className={'status-badge ' + (statusB.ok ? 'ok' : 'err')}>
                      {statusB.msg}
                    </div>
                  )}
                </div>
              </div>
              
              <TempBadge 
                data={tempB} 
                offset={offsets.b} 
                unitId="b"
                calibratedTempC={tempB ? applyCalibratedTemp('b', tempB.temp_c) : null}
              />
              <TempOffset value={offsets.b} onChange={v => setOffset('b', v)} />
            </div>

            {/* ── UNIT C ── */}
            <div className={`m-card unit ${!unitAReachable ? 'alert' : ''}`}>
              {!unitAReachable && (
                <div className="unit-alert-banner">
                  <span className="material-symbols-outlined" style={{fontSize:'16px'}}>warning</span>
                  <span>Unit A Offline</span>
                </div>
              )}
              <div className="unit-header">
                <div className="unit-swatch" style={{ background: colors.c }} />
                <div className="unit-title-group">
                  <div className="unit-label">
                    Unit C
                    <span className="unit-role-chip">{info.unitC ? info.unitC.role : 'sensor'}</span>
                  </div>
                  <div className="unit-sensor-chip">{info.unitC ? info.unitC.sensor : 'DHT11'}</div>
                </div>
              </div>

              <div className="unit-meta">
                <div className="unit-meta-row"><span className="unit-meta-label">MAC</span><span className="unit-meta-val">{info.unitC ? info.unitC.mac : '—'}</span></div>
                {info.unitC && info.unitC.port && <div className="unit-meta-row"><span className="unit-meta-label">COM Port</span><span className="unit-meta-val">{info.unitC.port}</span></div>}
                {info.unitC && info.unitC.transport && <div className="unit-meta-row"><span className="unit-meta-label">Link</span><span className="unit-meta-val transport">{info.unitC.transport}</span></div>}
              </div>

              <div className="mode-row">
                <label style={{display:'flex', alignItems:'center', gap:'4px', cursor:'pointer'}}>
                  <input type="radio" name="modeC" value="match"
                         checked={modeC === 'match'}
                         onChange={() => dispatch({ type: 'MODE_C', mode: 'match' })}
                         style={{accentColor: 'var(--md-sys-color-primary)'}} />
                  <span>Match Unit A</span>
                </label>
                <label style={{display:'flex', alignItems:'center', gap:'4px', cursor:'pointer'}}>
                  <input type="radio" name="modeC" value="independent"
                         checked={modeC === 'independent'}
                         onChange={() => dispatch({ type: 'MODE_C', mode: 'independent' })}
                         style={{accentColor: 'var(--md-sys-color-primary)'}} />
                  <span>Independent</span>
                </label>
              </div>
              
              <div className="color-control-box">
                <div 
                  className="color-toggle" 
                  onClick={() => setColorExpanded(prev => ({ ...prev, c: !prev.c }))}
                >
                  <div className="color-toggle-indicator" style={{ background: colors.c }} />
                  <span>LED Node Control</span>
                  <span style={{ marginLeft: 'auto' }} className="material-symbols-outlined">
                    {colorExpanded.c ? 'expand_less' : 'expand_more'}
                  </span>
                </div>
                
                <div className={'color-section' + (colorExpanded.c ? ' open' : '')}>
                  <ColorPicker hex={colors.c}
                               onChange={hex => dispatch({ type: 'COLOR', unit: 'c', hex })}
                               disabled={modeC === 'match'} />
                  <div className="picker-actions">
                    <button className="m-btn m-btn-primary"
                            disabled={busyC || modeC === 'match'}
                            onClick={() => { const {r,g,b} = hexToRgb(colors.c); sendColor('c',r,g,b,setBusyC,setStatusC); }}>
                      Apply Color
                    </button>
                    <button className="m-btn m-btn-secondary"
                            disabled={busyC || modeC === 'match'}
                            onClick={() => sendColor('c', 0, 0, 0, setBusyC, setStatusC)}>
                      Off
                    </button>
                  </div>
                  {statusC && (
                    <div className={'status-badge ' + (statusC.ok ? 'ok' : 'err')}>
                      {statusC.msg}
                    </div>
                  )}
                </div>
              </div>
              
              <TempBadge 
                data={tempC} 
                offset={offsets.c} 
                unitId="c"
                calibratedTempC={tempC ? applyCalibratedTemp('c', tempC.temp_c) : null}
              />
              <TempOffset value={offsets.c} onChange={v => setOffset('c', v)} />
            </div>

          </div>
        </div>

        {/* ── TEMPERATURE GRAPH TAB ── */}
        <div className={'tab-panel' + (activeTab === 'graph' ? ' active' : '')}>
          <TemperatureGraph />
        </div>

        {/* ── CALIBRATION TAB ── */}
        <div className={'tab-panel' + (activeTab === 'calibration' ? ' active' : '')}>
          <CalibrationPanel />
        </div>

        {/* ── LOGS TAB ── */}
        <div className={'tab-panel' + (activeTab === 'log' ? ' active' : '')}>
          <ActivityLog entries={log} />
        </div>
      </div>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
