// ── TemperatureGraph ──────────────────────────────────────────────────────────
function TemperatureGraph({ history }) {
  const canvasRef = useRef(null);
  const chartRef = useRef(null);
  const [timeRange, setTimeRange] = useState(6); // hours
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState(null);
  const [readings, setReadings] = useState([]);

  // Fetch data when timeRange changes
  useEffect(() => {
    async function fetchHistory() {
      setLoading(true);
      setError(null);
      try {
        console.log('[graph] Fetching temperature history for', timeRange, 'hours');
        const response = await fetch(`/api/temperature/history?hours=${timeRange}&limit=1000`);
        const data = await response.json();
        console.log('[graph] Received data:', data.ok, 'count:', data.count);
        if (data.ok && data.readings) {
          setReadings(data.readings);
        } else {
          setError('No data available');
          setReadings([]);
        }
      } catch (err) {
        console.error('[graph] Failed to fetch history:', err);
        setError(err.message);
        setReadings([]);
      } finally {
        setLoading(false);
      }
    }
    fetchHistory();

    // Refresh every minute
    const interval = setInterval(fetchHistory, 60000);
    return () => clearInterval(interval);
  }, [timeRange]);

  // Update chart when readings or canvas ref changes
  useEffect(() => {
    if (!loading && readings.length > 0 && canvasRef.current) {
      console.log('[graph] Canvas ready, creating chart with', readings.length, 'readings');
      updateChart(readings);
    }
  }, [readings, loading]);

  function updateChart(readings) {
    if (!canvasRef.current) {
      console.log('[graph] Canvas ref not ready');
      return;
    }
    
    if (!readings || readings.length === 0) {
      console.log('[graph] No readings to display');
      setError('No temperature data recorded yet');
      return;
    }

    console.log('[graph] Updating chart with', readings.length, 'readings');

    // Group readings by timestamp
    const byTimestamp = {};
    readings.forEach(r => {
      if (!byTimestamp[r.timestamp]) {
        byTimestamp[r.timestamp] = { timestamp: r.timestamp, a: null, b: null, c: null };
      }
      byTimestamp[r.timestamp][r.unit_id] = r.temp_c;
    });

    const points = Object.values(byTimestamp).sort((x, y) => x.timestamp - y.timestamp);
    console.log('[graph] Grouped into', points.length, 'time points');

    // Convert to chart format
    const labels = points.map(p => {
      const d = new Date(p.timestamp * 1000);
      return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    });

    const dataA = points.map(p => p.a !== null ? (p.a * 9/5 + 32) : null);
    const dataB = points.map(p => p.b !== null ? (p.b * 9/5 + 32) : null);
    const dataC = points.map(p => p.c !== null ? (p.c * 9/5 + 32) : null);

    // Calculate dynamic Y-axis range: default 60-100, expand ±5 if needed, round to nearest 5
    const allTemps = [...dataA, ...dataB, ...dataC].filter(t => t !== null);
    let yMin = 60;
    let yMax = 100;
    if (allTemps.length > 0) {
      const minTemp = Math.min(...allTemps);
      const maxTemp = Math.max(...allTemps);
      // If data goes below 60, expand down by 5 and round to nearest 5
      if (minTemp < 60) {
        yMin = Math.floor((minTemp - 5) / 5) * 5;
      }
      // If data goes above 100, expand up by 5 and round to nearest 5
      if (maxTemp > 100) {
        yMax = Math.ceil((maxTemp + 5) / 5) * 5;
      }
    }

    // Destroy old chart if exists
    if (chartRef.current) {
      chartRef.current.destroy();
      chartRef.current = null;
    }

    // Check if Chart.js is loaded
    if (typeof Chart === 'undefined') {
      console.error('[graph] Chart.js not loaded!');
      setError('Chart library not loaded');
      return;
    }

    // Create new chart
    try {
      const ctx = canvasRef.current.getContext('2d');
      chartRef.current = new Chart(ctx, {
        type: 'line',
        data: {
          labels,
          datasets: [
            {
              label: 'Unit A (DHT22)',
              data: dataA,
              borderColor: '#7ecfff',
              backgroundColor: 'rgba(126, 207, 255, 0.1)',
              borderWidth: 2,
              pointRadius: 3,
              pointHoverRadius: 5,
              tension: 0.3,
              spanGaps: true,
            },
            {
              label: 'Unit B (SHT30)',
              data: dataB,
              borderColor: '#5fdb8a',
              backgroundColor: 'rgba(95, 219, 138, 0.1)',
              borderWidth: 2,
              pointRadius: 3,
              pointHoverRadius: 5,
              tension: 0.3,
              spanGaps: true,
            },
            {
              label: 'Unit C (DHT11)',
              data: dataC,
              borderColor: '#facc15',
              backgroundColor: 'rgba(250, 204, 21, 0.1)',
              borderWidth: 2,
              pointRadius: 3,
              pointHoverRadius: 5,
              tension: 0.3,
              spanGaps: true,
            },
          ],
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          interaction: {
            mode: 'index',
            intersect: false,
          },
          plugins: {
            legend: {
              position: 'top',
              labels: {
                color: '#aaa',
                font: { size: 12 },
                usePointStyle: true,
                padding: 15,
              },
            },
            tooltip: {
              backgroundColor: 'rgba(0, 0, 0, 0.8)',
              titleColor: '#fff',
              bodyColor: '#ccc',
              borderColor: '#444',
              borderWidth: 1,
              padding: 10,
              displayColors: true,
              callbacks: {
                label: function(context) {
                  let label = context.dataset.label || '';
                  if (label) label += ': ';
                  if (context.parsed.y !== null) {
                    label += context.parsed.y.toFixed(1) + ' °F';
                  } else {
                    label += 'No data';
                  }
                  return label;
                }
              }
            },
          },
          scales: {
            x: {
              grid: {
                color: '#2a2a2a',
              },
              ticks: {
                color: '#888',
                maxRotation: 45,
                minRotation: 0,
              },
            },
            y: {
              min: yMin,
              max: yMax,
              title: {
                display: true,
                text: 'Temperature (°F)',
                color: '#aaa',
              },
              grid: {
                color: '#2a2a2a',
              },
              ticks: {
                color: '#888',
                stepSize: 5,
                callback: function(value) {
                  return value.toFixed(0) + '°';
                }
              },
            },
          },
        },
      });
      console.log('[graph] Chart created successfully');
      setError(null);
    } catch (err) {
      console.error('[graph] Error creating chart:', err);
      setError('Failed to create chart: ' + err.message);
    }
  }

  return (
    <div className="temp-graph-panel">
      <div className="temp-graph-title">
        <span>Temperature History</span>
        <div className="temp-graph-controls">
          <button
            className={'temp-graph-btn' + (timeRange === 1 ? ' active' : '')}
            onClick={() => setTimeRange(1)}
          >
            1h
          </button>
          <button
            className={'temp-graph-btn' + (timeRange === 6 ? ' active' : '')}
            onClick={() => setTimeRange(6)}
          >
            6h
          </button>
          <button
            className={'temp-graph-btn' + (timeRange === 24 ? ' active' : '')}
            onClick={() => setTimeRange(24)}
          >
            24h
          </button>
          <button
            className={'temp-graph-btn' + (timeRange === 168 ? ' active' : '')}
            onClick={() => setTimeRange(168)}
          >
            7d
          </button>
        </div>
      </div>
      {loading ? (
        <div className="temp-graph-loading">Loading temperature history...</div>
      ) : error ? (
        <div className="temp-graph-loading" style={{color: '#ea580c'}}>
          {error}
        </div>
      ) : (
        <div className="temp-graph-canvas">
          <canvas ref={canvasRef}></canvas>
        </div>
      )}
    </div>
  );
}

// ── CalibrationPanel ──────────────────────────────────────────────────────────
function CalibrationPanel() {
  const [sessions, setSessions] = useState([]);
  const [coefficients, setCoefficients] = useState({});
  const [loading, setLoading] = useState(false);
  const [message, setMessage] = useState(null);
  
  // Form state for new calibration session
  const [sessionName, setSessionName] = useState('');
  const [referenceTemp, setReferenceTemp] = useState('');
  const [startTime, setStartTime] = useState('');
  const [endTime, setEndTime] = useState('');
  const [notes, setNotes] = useState('');
  const [preview, setPreview] = useState(null);
  const [computeDegree, setComputeDegree] = useState(2);

  // ── Auto-Sync Calibration Mode state ──
  const [autoMode, setAutoMode] = useState({ enabled: false, degree: 1, autoRecompute: true, captureWindowSec: 90 });
  const [coverage, setCoverage] = useState({ numPoints: 0, minF: null, maxF: null });
  const [captureLabel, setCaptureLabel] = useState('');
  const [captureRef, setCaptureRef] = useState('');
  const [capturing, setCapturing] = useState(false);
  const [lastCapture, setLastCapture] = useState(null);

  // ── Bootstrap (fit polynomial from all historical paired readings) ──
  const [bootstrapInfo, setBootstrapInfo] = useState(null);   // { numPaired, truthRangeF }
  const [bootstrapping, setBootstrapping] = useState(false);
  const [bootstrapDegree, setBootstrapDegree] = useState(2);
  const [bootstrapStartTime, setBootstrapStartTime] = useState('');
  const [bootstrapEndTime, setBootstrapEndTime] = useState('');
  
  // Fetch sessions and coefficients on mount
  useEffect(() => {
    fetchSessions();
    fetchCoefficients();
    fetchAutoMode();
    fetchBootstrapInfo();
  }, []);

  async function fetchBootstrapInfo() {
    try {
      const res = await fetch('/api/calibration/bootstrap');
      const data = await res.json();
      if (data.ok) setBootstrapInfo(data);
    } catch (err) {
      console.error('[bootstrap] fetch failed:', err);
    }
  }

  async function handleBootstrap() {
    if (!bootstrapInfo || bootstrapInfo.numPaired === 0) {
      setMessage({ type: 'error', text: 'No paired historical readings available.' });
      return;
    }
    const timeRangeDesc = (!bootstrapStartTime && !bootstrapEndTime) 
      ? 'all data'
      : (bootstrapStartTime && bootstrapEndTime
        ? `data from ${new Date(bootstrapStartTime).toLocaleDateString()} to ${new Date(bootstrapEndTime).toLocaleDateString()}`
        : (bootstrapStartTime
          ? `data from ${new Date(bootstrapStartTime).toLocaleDateString()} onwards`
          : `data up to ${new Date(bootstrapEndTime).toLocaleDateString()}`));
    if (!confirm(`Fit a degree-${bootstrapDegree} polynomial from ${bootstrapInfo.numPaired} paired readings (${timeRangeDesc})? This will overwrite any existing coefficients.`)) return;
    setBootstrapping(true);
    setMessage({ type: 'info', text: 'Fitting polynomial from history…' });
    try {
      const body = { degree: bootstrapDegree };
      if (bootstrapStartTime) {
        body.startTime = Math.floor(new Date(bootstrapStartTime).getTime() / 1000);
      }
      if (bootstrapEndTime) {
        body.endTime = Math.floor(new Date(bootstrapEndTime).getTime() / 1000);
      }
      const res = await fetch('/api/calibration/bootstrap', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });
      const data = await res.json();
      if (data.ok) {
        const rmseTxt = ['a','b','c']
          .filter(u => data.results[u])
          .map(u => `${u.toUpperCase()}=${data.results[u].rmse.toFixed(3)}°C`)
          .join(', ');
        setMessage({
          type: 'success',
          text: `Bootstrapped degree-${data.degree} polynomial from ${data.numPaired} pairs (${data.truthRangeF.min.toFixed(1)}–${data.truthRangeF.max.toFixed(1)}°F). RMSE: ${rmseTxt}`,
        });
        fetchCoefficients();
        fetchAutoMode();
      } else {
        setMessage({ type: 'error', text: data.message });
      }
    } catch (err) {
      setMessage({ type: 'error', text: 'Bootstrap failed: ' + err.message });
    } finally {
      setBootstrapping(false);
    }
  }

  async function fetchAutoMode() {
    try {
      const res = await fetch('/api/calibration/automode');
      const data = await res.json();
      if (data.ok) {
        setAutoMode(data.mode);
        if (data.coverage) setCoverage(data.coverage);
      }
    } catch (err) {
      console.error('[autoCal] fetch failed:', err);
    }
  }

  async function toggleAutoMode(enabled) {
    try {
      const res = await fetch('/api/calibration/automode', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ enabled }),
      });
      const data = await res.json();
      if (data.ok) {
        setAutoMode(data.mode);
        setMessage({ type: 'success', text: enabled ? 'Auto-Sync mode ENABLED — place all sensors together, then capture points.' : 'Auto-Sync mode disabled.' });
      } else {
        setMessage({ type: 'error', text: data.message });
      }
    } catch (err) {
      setMessage({ type: 'error', text: 'Failed: ' + err.message });
    }
  }

  async function updateAutoModeSetting(patch) {
    try {
      const res = await fetch('/api/calibration/automode', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(patch),
      });
      const data = await res.json();
      if (data.ok) setAutoMode(data.mode);
    } catch (err) {
      console.error('[autoCal] update failed:', err);
    }
  }

  async function handleCapturePoint() {
    setCapturing(true);
    setMessage({ type: 'info', text: 'Capturing… triggering sync and collecting 3 samples (~5s)…' });
    try {
      const res = await fetch('/api/calibration/capture', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          label: captureLabel || null,
          referenceTemp: captureRef || null,
        }),
      });
      const data = await res.json();
      if (data.ok) {
        setLastCapture(data);
        const fmt = (c) => c === null || c === undefined ? '—' : (c * 9 / 5 + 32).toFixed(1) + '°F';
        const recomputeMsg = data.recompute
          ? (data.recompute.ok ? ` Recomputed: ${Object.keys(data.recompute.results || {}).length} unit(s).` : ` Recompute failed: ${data.recompute.message}`)
          : '';
        setMessage({
          type: 'success',
          text: `Captured "${data.label}" — A=${fmt(data.means.a)} B=${fmt(data.means.b)} C=${fmt(data.means.c)} (mean=${fmt(data.groupMean)}).${recomputeMsg}`,
        });
        setCaptureLabel('');
        setCaptureRef('');
        fetchSessions();
        fetchCoefficients();
        fetchAutoMode();
      } else {
        setMessage({ type: 'error', text: data.message });
      }
    } catch (err) {
      setMessage({ type: 'error', text: 'Capture failed: ' + err.message });
    } finally {
      setCapturing(false);
    }
  }
  
  async function fetchSessions() {
    try {
      const res = await fetch('/api/calibration/sessions');
      const data = await res.json();
      if (data.ok) setSessions(data.sessions);
    } catch (err) {
      console.error('[calibration] Failed to fetch sessions:', err);
    }
  }
  
  async function fetchCoefficients() {
    try {
      const res = await fetch('/api/calibration/coefficients');
      const data = await res.json();
      if (data.ok) setCoefficients(data.coefficients);
    } catch (err) {
      console.error('[calibration] Failed to fetch coefficients:', err);
    }
  }
  
  async function handlePreview() {
    if (!startTime || !endTime) {
      setMessage({ type: 'error', text: 'Please select start and end times' });
      return;
    }
    
    const start = Math.floor(new Date(startTime).getTime() / 1000);
    const end = Math.floor(new Date(endTime).getTime() / 1000);
    
    if (end <= start) {
      setMessage({ type: 'error', text: 'End time must be after start time' });
      return;
    }
    
    try {
      const res = await fetch(`/api/calibration/preview?startTime=${start}&endTime=${end}`);
      const data = await res.json();
      if (data.ok) {
        setPreview(data.preview);
        setMessage(null);
      } else {
        setMessage({ type: 'error', text: data.message });
      }
    } catch (err) {
      setMessage({ type: 'error', text: 'Failed to load preview: ' + err.message });
    }
  }
  
  async function handleCreateSession(e) {
    e.preventDefault();
    
    if (!startTime || !endTime) {
      setMessage({ type: 'error', text: 'Please select start and end times' });
      return;
    }
    
    const start = Math.floor(new Date(startTime).getTime() / 1000);
    const end = Math.floor(new Date(endTime).getTime() / 1000);
    
    if (end <= start) {
      setMessage({ type: 'error', text: 'End time must be after start time' });
      return;
    }
    
    setLoading(true);
    try {
      const res = await fetch('/api/calibration/sessions', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          name: sessionName || null,
          referenceTemp: referenceTemp ? parseFloat(referenceTemp) : null,
          startTime: start,
          endTime: end,
          notes: notes || null,
        }),
      });
      
      const data = await res.json();
      if (data.ok) {
        setMessage({ type: 'success', text: 'Calibration session created!' });
        // Reset form
        setSessionName('');
        setReferenceTemp('');
        setStartTime('');
        setEndTime('');
        setNotes('');
        setPreview(null);
        // Refresh sessions list
        fetchSessions();
      } else {
        setMessage({ type: 'error', text: data.message });
      }
    } catch (err) {
      setMessage({ type: 'error', text: 'Failed to create session: ' + err.message });
    } finally {
      setLoading(false);
    }
  }
  
  async function handleDeleteSession(sessionId) {
    if (!confirm('Delete this calibration session?')) return;
    
    try {
      const res = await fetch(`/api/calibration/sessions/${sessionId}`, { method: 'DELETE' });
      const data = await res.json();
      if (data.ok) {
        setMessage({ type: 'success', text: 'Session deleted' });
        fetchSessions();
      } else {
        setMessage({ type: 'error', text: data.message });
      }
    } catch (err) {
      setMessage({ type: 'error', text: 'Failed to delete session: ' + err.message });
    }
  }
  
  async function handleComputeCalibration() {
    if (sessions.length === 0) {
      setMessage({ type: 'error', text: 'No calibration sessions found. Create sessions first.' });
      return;
    }
    
    setLoading(true);
    setMessage({ type: 'info', text: 'Computing calibration coefficients...' });
    
    try {
      const res = await fetch('/api/calibration/compute', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ degree: computeDegree }),
      });
      
      const data = await res.json();
      if (data.ok) {
        setMessage({ type: 'success', text: 'Calibration computed successfully!' });
        fetchCoefficients();
      } else {
        setMessage({ type: 'error', text: data.message });
      }
    } catch (err) {
      setMessage({ type: 'error', text: 'Failed to compute calibration: ' + err.message });
    } finally {
      setLoading(false);
    }
  }
  
  async function handleDeleteCoefficients(unitId) {
    if (!confirm(`Delete calibration for Unit ${unitId.toUpperCase()}?`)) return;
    
    try {
      const res = await fetch(`/api/calibration/coefficients/${unitId}`, { method: 'DELETE' });
      const data = await res.json();
      if (data.ok) {
        setMessage({ type: 'success', text: 'Calibration deleted' });
        fetchCoefficients();
      } else {
        setMessage({ type: 'error', text: data.message });
      }
    } catch (err) {
      setMessage({ type: 'error', text: 'Failed to delete: ' + err.message });
    }
  }
  
  function setTimeRangeToday() {
    const now = new Date();
    const start = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 0, 0);
    setStartTime(start.toISOString().slice(0, 16));
    setEndTime(now.toISOString().slice(0, 16));
  }
  
  function setTimeRangeLast24h() {
    const now = new Date();
    const start = new Date(now.getTime() - 24 * 60 * 60 * 1000);
    setStartTime(start.toISOString().slice(0, 16));
    setEndTime(now.toISOString().slice(0, 16));
  }
  
  return (
    <div className="cal-panel">
      
      {/* Message banner */}
      {message && (
        <div style={{
          padding: '12px',
          marginBottom: '16px',
          borderRadius: '6px',
          background: message.type === 'error' ? '#2a1a1a' : message.type === 'success' ? '#1a2a1a' : '#1a1a2a',
          color: message.type === 'error' ? '#f87171' : message.type === 'success' ? '#4ade80' : '#7ecfff',
          border: `1px solid ${message.type === 'error' ? '#8b0000' : message.type === 'success' ? '#2d7a3e' : '#2d5af5'}`,
          fontSize: '.85rem',
        }}>
          {message.text}
        </div>
      )}
      
      {/* Section 0: Auto-Sync Calibration Mode (NEW) */}
      <div className="cal-section" style={{
        border: autoMode.enabled ? '2px solid #2d5af5' : '1px solid #2a2a2a',
        borderRadius: '8px',
        padding: '14px',
        background: autoMode.enabled ? 'rgba(45,90,245,0.06)' : 'transparent',
      }}>
        <div className="cal-section-title" style={{ display: 'flex', alignItems: 'center', gap: '10px' }}>
          🤖 Auto-Sync Calibration Mode
          <span style={{
            fontSize: '.7rem',
            padding: '2px 8px',
            borderRadius: '10px',
            background: autoMode.enabled ? '#2d5af5' : '#333',
            color: '#fff',
          }}>
            {autoMode.enabled ? 'ON' : 'OFF'}
          </span>
        </div>

        <p style={{ fontSize: '.8rem', color: '#888', marginBottom: '12px', lineHeight: 1.5 }}>
          Place all 3 sensors together so they read the same true temperature.
          Enable the mode, then click <strong>Capture Point Now</strong> after each stabilisation.
          Move the cluster to a new temperature (cold room, warm room, hot box, fridge…),
          wait 10–15&nbsp;min, capture again. The server will refit the equation across the whole range automatically.
        </p>

        {/* Toggle + settings row */}
        <div style={{ display: 'flex', flexWrap: 'wrap', gap: '12px', alignItems: 'center', marginBottom: '14px' }}>
          <button
            className={'cal-btn' + (autoMode.enabled ? ' cal-btn-danger' : '')}
            onClick={() => toggleAutoMode(!autoMode.enabled)}
            style={{ flex: 'none' }}
          >
            {autoMode.enabled ? 'Disable Mode' : 'Enable Auto-Sync Mode'}
          </button>

          <label style={{ fontSize: '.8rem', color: '#bbb', display: 'flex', alignItems: 'center', gap: '6px' }}>
            Degree:
            <select
              className="cal-input"
              value={autoMode.degree}
              onChange={(e) => updateAutoModeSetting({ degree: parseInt(e.target.value) })}
              style={{ flex: 'none', width: '120px' }}
            >
              <option value={1}>1 (Linear)</option>
              <option value={2}>2 (Quadratic)</option>
              <option value={3}>3 (Cubic)</option>
            </select>
          </label>

          <label style={{ fontSize: '.8rem', color: '#bbb', display: 'flex', alignItems: 'center', gap: '6px' }}>
            <input
              type="checkbox"
              checked={autoMode.autoRecompute}
              onChange={(e) => updateAutoModeSetting({ autoRecompute: e.target.checked })}
            />
            Auto-recompute equation after each capture
          </label>
        </div>

        {/* Coverage summary */}
        <div style={{
          padding: '10px 12px',
          background: '#181818',
          borderRadius: '6px',
          fontSize: '.78rem',
          color: '#bbb',
          marginBottom: '14px',
        }}>
          <strong style={{ color: '#fff' }}>Coverage:</strong>{' '}
          {coverage.numPoints === 0 ? (
            <span style={{ color: '#facc15' }}>No calibration points yet. Capture at least 2 (linear) or 5 (quadratic) across your range.</span>
          ) : (
            <>
              {coverage.numPoints} point(s)
              {coverage.minF !== null && coverage.maxF !== null && (
                <> spanning <strong style={{ color: '#7ecfff' }}>{coverage.minF.toFixed(1)}°F → {coverage.maxF.toFixed(1)}°F</strong> ({(coverage.maxF - coverage.minF).toFixed(1)}°F range)</>
              )}
              {coverage.numPoints < (autoMode.degree + 1) && (
                <span style={{ color: '#facc15' }}> — need {autoMode.degree + 1 - coverage.numPoints} more for degree {autoMode.degree}.</span>
              )}
              {coverage.numPoints >= (autoMode.degree + 1) && coverage.rangeC !== null && coverage.rangeC < 10 && (
                <span style={{ color: '#facc15' }}> — try adding points farther apart (current spread is small).</span>
              )}
            </>
          )}
        </div>

        {/* Bootstrap from existing history */}
        <div style={{
          padding: '12px',
          background: '#1a1f0e',
          border: '1px solid #6b7f1e',
          borderRadius: '6px',
          marginBottom: '14px',
        }}>
          <div style={{ display: 'flex', alignItems: 'center', gap: '10px', flexWrap: 'wrap', marginBottom: '10px' }}>
            <strong style={{ color: '#e8ed9e', fontSize: '.85rem' }}>📚 Bootstrap from History</strong>
            <span style={{ fontSize: '.75rem', color: '#bbb' }}>
              {bootstrapInfo
                ? (bootstrapInfo.numPaired > 0 && bootstrapInfo.truthRangeF
                  ? `${bootstrapInfo.numPaired} paired readings, range ${bootstrapInfo.truthRangeF.min.toFixed(1)}–${bootstrapInfo.truthRangeF.max.toFixed(1)}°F (${bootstrapInfo.truthRangeF.spread.toFixed(1)}°F spread)`
                  : bootstrapInfo.numPaired > 0
                  ? `${bootstrapInfo.numPaired} paired readings (range data unavailable)`
                  : 'no paired readings in selected time range')
                : 'loading…'}
            </span>
          </div>
          <p style={{ fontSize: '.75rem', color: '#999', margin: '0 0 12px 0' }}>
            Select a time range when all 3 sensors were colocated. Leave blank to use all data.
          </p>
          
          {/* Time range selection */}
          <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(280px, 1fr))', gap: '10px', marginBottom: '12px' }}>
            <div>
              <label style={{ fontSize: '.75rem', color: '#bbb', display: 'block', marginBottom: '4px' }}>Start Time (leave blank for all before end)</label>
              <div style={{ display: 'flex', gap: '6px', alignItems: 'center' }}>
                <input
                  type="datetime-local"
                  className="cal-input"
                  value={bootstrapStartTime}
                  onChange={(e) => setBootstrapStartTime(e.target.value)}
                  disabled={bootstrapping}
                  style={{ flex: '1' }}
                />
                <button
                  className="cal-btn cal-btn-secondary"
                  onClick={() => setBootstrapStartTime('')}
                  disabled={bootstrapping || !bootstrapStartTime}
                  style={{ padding: '6px 10px', fontSize: '.7rem' }}
                  title="Clear start time"
                >
                  Clear
                </button>
              </div>
            </div>
            <div>
              <label style={{ fontSize: '.75rem', color: '#bbb', display: 'block', marginBottom: '4px' }}>End Time (leave blank for all after start)</label>
              <div style={{ display: 'flex', gap: '6px', alignItems: 'center' }}>
                <input
                  type="datetime-local"
                  className="cal-input"
                  value={bootstrapEndTime}
                  onChange={(e) => setBootstrapEndTime(e.target.value)}
                  disabled={bootstrapping}
                  style={{ flex: '1' }}
                />
                <button
                  className="cal-btn cal-btn-secondary"
                  onClick={() => setBootstrapEndTime('')}
                  disabled={bootstrapping || !bootstrapEndTime}
                  style={{ padding: '6px 10px', fontSize: '.7rem' }}
                  title="Clear end time"
                >
                  Clear
                </button>
              </div>
            </div>
          </div>
          
          <div style={{ display: 'flex', flexWrap: 'wrap', gap: '10px', alignItems: 'center' }}>
            <label style={{ fontSize: '.8rem', color: '#bbb', display: 'flex', alignItems: 'center', gap: '6px' }}>
              Degree:
              <select
                className="cal-input"
                value={bootstrapDegree}
                onChange={(e) => setBootstrapDegree(parseInt(e.target.value))}
                style={{ flex: 'none', width: '120px' }}
                disabled={bootstrapping}
              >
                <option value={1}>1 (Linear)</option>
                <option value={2}>2 (Quadratic)</option>
                <option value={3}>3 (Cubic)</option>
              </select>
            </label>
            <button
              className="cal-btn"
              onClick={fetchBootstrapInfo}
              disabled={bootstrapping}
              style={{ flex: 'none' }}
            >
              📊 Preview Data
            </button>
            <button
              className="cal-btn"
              onClick={handleBootstrap}
              disabled={bootstrapping || !bootstrapInfo || bootstrapInfo.numPaired === 0}
              style={{ flex: 'none', background: '#2d5af5', border: '1px solid #4a7bff' }}
            >
              {bootstrapping ? '⏳ Fitting…' : '✅ Fit & Save Equation'}
            </button>
          </div>
          {bootstrapInfo && bootstrapInfo.truthRangeF && bootstrapInfo.truthRangeF.spread < 15 && (
            <div style={{ fontSize: '.72rem', color: '#facc15', marginTop: '8px' }}>
              ⚠️ Range is narrow ({bootstrapInfo.truthRangeF.spread.toFixed(1)}°F). The fit will be valid in this band only.
              For full-range accuracy (e.g. 50°F & 105°F), enable Auto-Sync Mode below and capture points at extreme temperatures.
            </div>
          )}
        </div>

        {/* Capture form (only when enabled) */}
        {autoMode.enabled && (
          <div style={{
            padding: '14px',
            background: '#0e1422',
            borderRadius: '6px',
            border: '1px solid #2d5af5',
          }}>
            <div style={{ display: 'flex', flexWrap: 'wrap', gap: '10px', alignItems: 'center' }}>
              <input
                type="text"
                className="cal-input"
                placeholder="Optional label (auto-generated if blank)"
                value={captureLabel}
                onChange={(e) => setCaptureLabel(e.target.value)}
                style={{ flex: '2 1 220px' }}
                disabled={capturing}
              />
              <input
                type="number"
                step="0.1"
                className="cal-input"
                placeholder="Ref temp (°C, optional)"
                value={captureRef}
                onChange={(e) => setCaptureRef(e.target.value)}
                style={{ flex: '1 1 160px' }}
                disabled={capturing}
              />
              <button
                className="cal-btn"
                onClick={handleCapturePoint}
                disabled={capturing}
                style={{ flex: 'none', padding: '10px 18px', fontSize: '.9rem' }}
              >
                {capturing ? '⏳ Capturing…' : '📸 Capture Point Now'}
              </button>
            </div>
            <div className="cal-hint" style={{ marginTop: '10px' }}>
              ℹ️ Reference temp is optional. Leave blank to use the mean of all 3 sensors as truth (correct when sensors are colocated).
              Each capture takes ~5&nbsp;s: server triggers an ESP sync, then collects 3 fresh samples.
            </div>

            {lastCapture && (
              <div style={{
                marginTop: '12px',
                padding: '10px',
                background: '#1a2a1a',
                borderRadius: '4px',
                fontSize: '.78rem',
                color: '#9fe9b0',
              }}>
                ✓ Last capture: <strong>{lastCapture.label}</strong>
                {' — '}
                A={lastCapture.means.a !== null ? (lastCapture.means.a * 9 / 5 + 32).toFixed(1) + '°F' : '—'},{' '}
                B={lastCapture.means.b !== null ? (lastCapture.means.b * 9 / 5 + 32).toFixed(1) + '°F' : '—'},{' '}
                C={lastCapture.means.c !== null ? (lastCapture.means.c * 9 / 5 + 32).toFixed(1) + '°F' : '—'}
              </div>
            )}
          </div>
        )}
      </div>

      {/* Section 1: Create Calibration Session */}
      <div className="cal-section">
        <div className="cal-section-title">
          📊 Create Calibration Session
        </div>
        <p style={{ fontSize: '.8rem', color: '#888', marginBottom: '16px' }}>
          Select a time range when all sensors were in the same stable environment. 
          Optionally enter a reference temperature from an independent thermometer.
        </p>
        
        <form className="cal-form" onSubmit={handleCreateSession}>
          <div className="cal-form-row">
            <label className="cal-label">Session Name</label>
            <input 
              type="text" 
              className="cal-input" 
              placeholder="e.g., Indoor baseline"
              value={sessionName}
              onChange={(e) => setSessionName(e.target.value)}
            />
          </div>
          
          <div className="cal-form-row">
            <label className="cal-label">Start Time</label>
            <input 
              type="datetime-local" 
              className="cal-input"
              value={startTime}
              onChange={(e) => setStartTime(e.target.value)}
              required
            />
            <button 
              type="button" 
              className="cal-btn cal-btn-secondary" 
              onClick={setTimeRangeToday}
              style={{ flex: 'none' }}
            >
              Today
            </button>
            <button 
              type="button" 
              className="cal-btn cal-btn-secondary" 
              onClick={setTimeRangeLast24h}
              style={{ flex: 'none' }}
            >
              Last 24h
            </button>
          </div>
          
          <div className="cal-form-row">
            <label className="cal-label">End Time</label>
            <input 
              type="datetime-local" 
              className="cal-input"
              value={endTime}
              onChange={(e) => setEndTime(e.target.value)}
              required
            />
          </div>
          
          <div className="cal-form-row">
            <label className="cal-label">Reference Temp (°C)</label>
            <input 
              type="number" 
              step="0.1"
              className="cal-input" 
              placeholder="Leave empty to use sensor mean"
              value={referenceTemp}
              onChange={(e) => setReferenceTemp(e.target.value)}
            />
          </div>
          <div className="cal-hint">
            ℹ️ If you have an independent thermometer reading, enter it here. 
            Otherwise, the system will use the mean of all sensors as the reference.
          </div>
          
          <div className="cal-form-row">
            <label className="cal-label">Notes</label>
            <input 
              type="text" 
              className="cal-input" 
              placeholder="Optional notes about this calibration point"
              value={notes}
              onChange={(e) => setNotes(e.target.value)}
            />
          </div>
          
          <div className="cal-form-row" style={{ gap: '12px' }}>
            <button 
              type="button" 
              className="cal-btn cal-btn-secondary" 
              onClick={handlePreview}
              disabled={loading}
            >
              Preview Data
            </button>
            <button 
              type="submit" 
              className="cal-btn"
              disabled={loading}
            >
              Create Session
            </button>
          </div>
        </form>
        
        {/* Preview panel */}
        {preview && (
          <div className="cal-preview">
            {['a', 'b', 'c'].map(unit => (
              <div key={unit} className="cal-preview-unit">
                <div className="cal-preview-label">Unit {unit.toUpperCase()}</div>
                {preview[unit] && preview[unit].count > 0 ? (
                  <>
                    <div className="cal-preview-value">
                      {preview[unit].mean.toFixed(2)}°C
                    </div>
                    <div className="cal-preview-range">
                      {preview[unit].min.toFixed(1)} – {preview[unit].max.toFixed(1)}°C ({preview[unit].count} readings)
                    </div>
                  </>
                ) : (
                  <div className="cal-preview-value" style={{ color: '#666' }}>No data</div>
                )}
              </div>
            ))}
          </div>
        )}
      </div>
      
      {/* Section 2: Existing Sessions */}
      <div className="cal-section">
        <div className="cal-section-title">
          📋 Calibration Sessions ({sessions.length})
        </div>
        
        {sessions.length === 0 ? (
          <div className="cal-empty">
            No calibration sessions yet. Create one above to get started.
          </div>
        ) : (
          <div className="cal-sessions">
            {sessions.map(session => (
              <div key={session.id} className="cal-session-card">
                <div className="cal-session-info">
                  <div className="cal-session-name">
                    {session.name || 'Unnamed Session'}
                  </div>
                  <div className="cal-session-meta">
                    {new Date(session.start_time * 1000).toLocaleString()} → {new Date(session.end_time * 1000).toLocaleString()}
                  </div>
                  {session.reference_temp && (
                    <div className="cal-session-ref">
                      Reference: {session.reference_temp.toFixed(2)}°C
                    </div>
                  )}
                  {session.notes && (
                    <div style={{ fontSize: '.7rem', color: '#999', marginTop: '4px' }}>
                      {session.notes}
                    </div>
                  )}
                </div>
                <div className="cal-session-actions">
                  <button 
                    className="cal-btn cal-btn-danger"
                    style={{ padding: '6px 12px', fontSize: '.75rem' }}
                    onClick={() => handleDeleteSession(session.id)}
                  >
                    Delete
                  </button>
                </div>
              </div>
            ))}
          </div>
        )}
      </div>
      
      {/* Section 3: Compute Calibration */}
      <div className="cal-section">
        <div className="cal-section-title">
          🧮 Compute Calibration Coefficients
        </div>
        <p style={{ fontSize: '.8rem', color: '#888', marginBottom: '16px' }}>
          After creating 5+ calibration sessions at different stable temperatures, 
          compute the polynomial correction coefficients.
        </p>
        
        <div className="cal-form-row" style={{ maxWidth: '600px', gap: '12px' }}>
          <label className="cal-label">Polynomial Degree</label>
          <select 
            className="cal-input" 
            value={computeDegree}
            onChange={(e) => setComputeDegree(parseInt(e.target.value))}
            style={{ flex: 'none', width: '100px' }}
          >
            <option value={1}>1 (Linear)</option>
            <option value={2}>2 (Quadratic)</option>
            <option value={3}>3 (Cubic)</option>
          </select>
          <button 
            className="cal-btn"
            onClick={handleComputeCalibration}
            disabled={loading || sessions.length === 0}
          >
            Compute Now
          </button>
        </div>
        
        <div className="cal-hint" style={{ marginTop: '12px' }}>
          ℹ️ Recommended: Use degree 2 (quadratic) with 5+ calibration points spread across your temperature range.
        </div>
      </div>
      
      {/* Section 4: Current Calibration Coefficients */}
      <div className="cal-section">
        <div className="cal-section-title">
          ✅ Active Calibration Coefficients
        </div>
        
        {Object.keys(coefficients).length === 0 ? (
          <div className="cal-empty">
            No calibration coefficients computed yet. Create sessions and compute calibration above.
          </div>
        ) : (
          <div className="cal-coeffs">
            {['a', 'b', 'c'].map(unitId => {
              const coeff = coefficients[unitId];
              if (!coeff) return null;
              
              return (
                <div key={unitId} className="cal-coeff-card">
                  <div className="cal-coeff-title">
                    Unit {unitId.toUpperCase()}
                    <button 
                      style={{ 
                        float: 'right', 
                        padding: '4px 8px', 
                        fontSize: '.7rem',
                        background: '#8b0000',
                        border: 'none',
                        borderRadius: '4px',
                        color: '#fff',
                        cursor: 'pointer',
                      }}
                      onClick={() => handleDeleteCoefficients(unitId)}
                    >
                      Delete
                    </button>
                  </div>
                  
                  <div className="cal-coeff-row">
                    <span className="cal-coeff-label">Degree:</span>
                    <span className="cal-coeff-value">{coeff.degree}</span>
                  </div>
                  
                  <div className="cal-coeff-row">
                    <span className="cal-coeff-label">c0 (constant):</span>
                    <span className="cal-coeff-value">{coeff.c0 != null ? coeff.c0.toFixed(6) : '—'}</span>
                  </div>
                  
                  <div className="cal-coeff-row">
                    <span className="cal-coeff-label">c1 (linear):</span>
                    <span className="cal-coeff-value">{coeff.c1 != null ? coeff.c1.toFixed(6) : '—'}</span>
                  </div>
                  
                  {coeff.degree >= 2 && (
                    <div className="cal-coeff-row">
                      <span className="cal-coeff-label">c2 (quadratic):</span>
                      <span className="cal-coeff-value">{coeff.c2 != null ? coeff.c2.toFixed(6) : '—'}</span>
                    </div>
                  )}
                  
                  {coeff.degree >= 3 && (
                    <div className="cal-coeff-row">
                      <span className="cal-coeff-label">c3 (cubic):</span>
                      <span className="cal-coeff-value">{coeff.c3 != null ? coeff.c3.toFixed(6) : '—'}</span>
                    </div>
                  )}
                  
                  <div className="cal-coeff-row">
                    <span className="cal-coeff-label">RMSE:</span>
                    <span className="cal-coeff-rmse">{coeff.rmse != null ? coeff.rmse.toFixed(3) + '°C' : '—'}</span>
                  </div>
                  
                  <div className="cal-coeff-row">
                    <span className="cal-coeff-label">Data Points:</span>
                    <span className="cal-coeff-value">{coeff.num_points}</span>
                  </div>
                  
                  <div style={{ fontSize: '.65rem', color: '#666', marginTop: '6px' }}>
                    Updated: {new Date(coeff.computed_at).toLocaleString()}
                  </div>
                </div>
              );
            })}
          </div>
        )}
      </div>
      
    </div>
  );
}

// ── App ───────────────────────────────────────────────────────────────────────
function App() {
  const [state, dispatch] = useReducer(reducer, INIT);
  const [activeTab, setActiveTab] = useState('controls');
  const [colorExpanded, setColorExpanded] = useState({ a: false, b: false, c: false });

  // per-unit send state — kept outside reducer for simplicity
  const [statusA, setStatusA] = useState(null);
  const [statusB, setStatusB] = useState(null);
  const [statusC, setStatusC] = useState(null);
  const [busyA, setBusyA]     = useState(false);
  const [busyB, setBusyB]     = useState(false);
  const [busyC, setBusyC]     = useState(false);

  // Per-unit calibration offsets in °F — persisted to localStorage
  const loadOffsets = () => {
    try { return JSON.parse(localStorage.getItem('tempOffsets') || 'null') || { a: 0, b: 0, c: 0 }; }
    catch { return { a: 0, b: 0, c: 0 }; }
  };
  const [offsets, setOffsets] = useState(loadOffsets);
  
  // Calibration coefficients (polynomial)
  const [calibCoeffs, setCalibCoeffs] = useState({});
  
  function setOffset(unit, val) {
    setOffsets(prev => {
      const next = { ...prev, [unit]: val };
      try { localStorage.setItem('tempOffsets', JSON.stringify(next)); } catch {}
      return next;
    });
  }

  // Sync-to-average includes — persisted to localStorage
  const loadSyncIncludes = () => {
    try { return JSON.parse(localStorage.getItem('syncIncludes') || 'null') || { a: true, b: true, c: true }; }
    catch { return { a: true, b: true, c: true }; }
  };
  const [syncIncludes, setSyncIncludes] = useState(loadSyncIncludes);
  function toggleSyncInclude(unit) {
    setSyncIncludes(prev => {
      const next = { ...prev, [unit]: !prev[unit] };
      try { localStorage.setItem('syncIncludes', JSON.stringify(next)); } catch {}
      return next;
    });
  }

  function syncToAverage() {
    const rawFs = {
      a: tempA ? (tempA.temp_c * 9/5 + 32) : null,
      b: tempB ? (tempB.temp_c * 9/5 + 32) : null,
      c: tempC ? (tempC.temp_c * 9/5 + 32) : null,
    };
    const included = ['a','b','c'].filter(u => syncIncludes[u] && rawFs[u] !== null);
    if (included.length < 2) return;
    const avg = included.reduce((s, u) => s + rawFs[u] + (offsets[u] || 0), 0) / included.length;
    setOffsets(prev => {
      const next = { ...prev };
      included.forEach(u => { next[u] = Math.round((avg - rawFs[u]) * 10) / 10; });
      try { localStorage.setItem('tempOffsets', JSON.stringify(next)); } catch {}
      return next;
    });
  }

  // Live RSSI via WebSocket
  useRssiWS(dispatch);

  // MAC info
  useEffect(() => {
    fetch('/api/info')
      .then(r => r.json())
      .then(d => dispatch({ type: 'INFO', data: d }))
      .catch(() => {});
  }, []);

  // Fetch calibration coefficients on mount and when tab changes to calibration
  useEffect(() => {
    fetch('/api/calibration/coefficients')
      .then(r => r.json())
      .then(d => { if (d.ok) setCalibCoeffs(d.coefficients); })
      .catch(() => {});
  }, [activeTab]); // Refresh when switching tabs

  // Helper function to apply polynomial calibration
  const applyCalibratedTemp = (unitId, rawTempC) => {
    if (rawTempC === null || rawTempC === undefined) return null;
    const coeff = calibCoeffs[unitId];
    if (!coeff) return rawTempC; // No calibration available
    
    // T_corrected = c0 + c1*T + c2*T^2 + c3*T^3
    const { c0, c1, c2, c3, degree } = coeff;
    let corrected = c0 + c1 * rawTempC;
    if (degree >= 2) corrected += c2 * rawTempC * rawTempC;
    if (degree >= 3) corrected += c3 * rawTempC * rawTempC * rawTempC;
    
    return corrected;
  };

  // Unit A health check — checks connectivity to Unit A (ESP32 sender)
  useEffect(() => {
    let consecutiveFailures = 0;
    async function checkUnitA() {
      try {
        const response = await fetch('/api/temp_a', { signal: AbortSignal.timeout(5000) });
        if (response.ok) {
          consecutiveFailures = 0;
          dispatch({ type: 'UNIT_A_REACHABLE', reachable: true });
        } else {
          consecutiveFailures++;
          if (consecutiveFailures >= 2) {
            dispatch({ type: 'UNIT_A_REACHABLE', reachable: false });
          }
        }
      } catch (error) {
        consecutiveFailures++;
        if (consecutiveFailures >= 2) {
          dispatch({ type: 'UNIT_A_REACHABLE', reachable: false });
        }
      }
    }
    checkUnitA(); // immediate check
    const id = setInterval(checkUnitA, 4000);
    return () => clearInterval(id);
  }, []);

  // Temperature polling
  useEffect(() => {
    async function poll() {
      try {
        const [ra, rb, rc] = await Promise.all([
          fetch('/api/temp_a').then(r => r.json()),
          fetch('/api/temp_b').then(r => r.json()),
          fetch('/api/temp_c').then(r => r.json()),
        ]);
        if (ra.ok) dispatch({ type: 'TEMP_A', data: ra });
        if (rb.ok) dispatch({ type: 'TEMP_B', data: rb });
        if (rc.ok) dispatch({ type: 'TEMP_C', data: rc });
      } catch (_) {}
    }
    poll();
    const id = setInterval(poll, 12000);
    return () => clearInterval(id);
  }, []);

  // REST fallback RSSI poll — shows signal data even when WebSocket hasn't connected yet
  useEffect(() => {
    async function fetchRssi() {
      try {
        const data = await fetch('/api/rssi').then(r => r.json());
        if (data.ok) dispatch({ type: 'RSSI', data: { wifi: data.wifi, b: data.b, c: data.c } });
      } catch (_) {}
    }
    fetchRssi();
    const id = setInterval(fetchRssi, 1000);
    return () => clearInterval(id);
  }, [dispatch]);

  // Send color to a unit
  async function sendColor(unit, r, g, b, setBusy, setStatus) {
    setBusy(true);
    setStatus({ ok: true, msg: 'Sending…' });
    try {
      const res  = await fetch('/api/color/' + unit, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ r, g, b }),
      });
      const data = await res.json();
      setStatus({ ok: data.ok, msg: data.message });
      const ts = new Date().toLocaleTimeString();
      dispatch({
        type: 'LOG',
        entry: { ts, unit: 'Unit ' + unit.toUpperCase(), ok: data.ok, msg: data.message },
      });
    } catch (e) {
      setStatus({ ok: false, msg: 'Network error: ' + e.message });
    } finally {
      setBusy(false);
    }
  }

  function handleSendA() {
    const { r, g, b } = hexToRgb(state.colors.a);
    const sends = [sendColor('a', r, g, b, setBusyA, setStatusA)];
    if (state.modeB === 'match') sends.push(sendColor('b', r, g, b, setBusyB, setStatusB));
    if (state.modeC === 'match') sends.push(sendColor('c', r, g, b, setBusyC, setStatusC));
    Promise.all(sends);
  }

  function handleColorA(hex) {
    // Single atomic dispatch so all swatches and pickers update in the same render
    const updates = { a: hex };
    if (state.modeB === 'match') updates.b = hex;
    if (state.modeC === 'match') updates.c = hex;
    dispatch({ type: 'SET_COLORS', updates });
  }

  const { rssi, colors, modeB, modeC, tempA, tempB, tempC, log, info, wsConnected, unitAReachable } = state;

  // Helper to check if sync is possible
  const canSync = () => {
    const rawFs = {
      a: tempA ? (tempA.temp_c * 9/5 + 32) : null,
      b: tempB ? (tempB.temp_c * 9/5 + 32) : null,
      c: tempC ? (tempC.temp_c * 9/5 + 32) : null,
    };
    const included = ['a','b','c'].filter(u => syncIncludes[u] && rawFs[u] !== null);
    return included.length >= 2;
  };

  // Helper to render signal row
  const renderSignalRow = (label, val) => {
    if (val === null || val === undefined) {
      return (
        <div className="signal-row" key={label}>
          <span className="signal-row-label">{label}</span>
          <span className="signal-dbm">—</span>
          <span className="signal-qual">no data</span>
        </div>
      );
    }
    // Extract rssi value if val is an object
    const dbm = (typeof val === 'object' && val.rssi !== undefined) ? val.rssi : val;
    let quality = 'excellent', color = '#4ade80';
    if (dbm >= -50) { quality = 'excellent'; color = '#4ade80'; }
    else if (dbm >= -60) { quality = 'good'; color = '#5fdb8a'; }
    else if (dbm >= -70) { quality = 'fair'; color = '#facc15'; }
    else { quality = 'weak'; color = '#ea580c'; }
    return (
      <div className="signal-row" key={label}>
        <span className="signal-row-label">{label}</span>
        <span className="signal-dbm" style={{ color }}>{dbm} dBm</span>
        <span className="signal-qual">{quality}</span>
      </div>
    );
  };

  return (
    <>
      {/* ── TABS ── */}
      <div className="tabs">
        <button 
          className={'tab-btn' + (activeTab === 'controls' ? ' active' : '')}
          onClick={() => setActiveTab('controls')}
        >
          Controls
        </button>
        <button 
          className={'tab-btn' + (activeTab === 'graph' ? ' active' : '')}
          onClick={() => setActiveTab('graph')}
        >
          Temperature History
        </button>
        <button 
          className={'tab-btn' + (activeTab === 'calibration' ? ' active' : '')}
          onClick={() => setActiveTab('calibration')}
        >
          Calibration
        </button>
        <button 
          className={'tab-btn' + (activeTab === 'log' ? ' active' : '')}
          onClick={() => setActiveTab('log')}
        >
          Activity Log
        </button>
      </div>

      {/* ── TAB CONTENT ── */}
      <div className="tab-content">
        
        {/* ── CONTROLS TAB ── */}
        <div className={'tab-panel' + (activeTab === 'controls' ? ' active' : '')}>
          
          {/* Status row with calibration and signal */}
          <div className="status-row">
            <div className="sync-panel">
              <div className="panel-title">Calibration Sync</div>
              <div className="sync-rows">
                <div className="sync-row">
                  <label className="sync-check">
                    <input
                      type="checkbox"
                      checked={syncIncludes.a}
                      disabled={!tempA}
                      onChange={() => toggleSyncInclude('a')}
                    />
                    <span className="sync-unit-name">A</span>
                    <span className="sync-sensor-tag">{UNIT_SENSORS.a}</span>
                  </label>
                  <span className="sync-disp-temp">
                    {tempA ? ((tempA.temp_c * 9/5 + 32) + (offsets.a || 0)).toFixed(1) + ' °F' : '—'}
                  </span>
                </div>
                <div className="sync-row">
                  <label className="sync-check">
                    <input
                      type="checkbox"
                      checked={syncIncludes.b}
                      disabled={!tempB}
                      onChange={() => toggleSyncInclude('b')}
                    />
                    <span className="sync-unit-name">B</span>
                    <span className="sync-sensor-tag">{UNIT_SENSORS.b}</span>
                  </label>
                  <span className="sync-disp-temp">
                    {tempB ? ((tempB.temp_c * 9/5 + 32) + (offsets.b || 0)).toFixed(1) + ' °F' : '—'}
                  </span>
                </div>
                <div className="sync-row">
                  <label className="sync-check">
                    <input
                      type="checkbox"
                      checked={syncIncludes.c}
                      disabled={!tempC}
                      onChange={() => toggleSyncInclude('c')}
                    />
                    <span className="sync-unit-name">C</span>
                    <span className="sync-sensor-tag">{UNIT_SENSORS.c}</span>
                  </label>
                  <span className="sync-disp-temp">
                    {tempC ? ((tempC.temp_c * 9/5 + 32) + (offsets.c || 0)).toFixed(1) + ' °F' : '—'}
                  </span>
                </div>
                <button className="sync-btn" onClick={syncToAverage} disabled={!canSync()}>
                  Sync
                </button>
              </div>
            </div>
            
            <div className="signal-panel">
              <div className="panel-title">
                Signal Strength
                <span className={'ws-dot ' + (wsConnected ? 'connected' : 'disconnected')} />
              </div>
              <div className="signal-rows">
                {renderSignalRow('A ↔ WiFi', rssi.wifi)}
                {renderSignalRow('A ↔ B', rssi.b)}
                {renderSignalRow('A ↔ C', rssi.c)}
              </div>
            </div>
          </div>

          {/* Unit cards */}
          <div className="grid">

        {/* ── UNIT A ── */}
        <div className="unit">
          <div className="unit-header">
            <div className="unit-swatch" style={{ background: colors.a }} />
            <div>
              <div className="unit-label">
                Unit A
                <span className="unit-role-chip">{info.unitA ? info.unitA.role : 'hub'}</span>
              </div>
              <div className="unit-sensor-chip">{info.unitA ? info.unitA.sensor : UNIT_SENSORS.a}</div>
              <div className="unit-meta">
                <div className="unit-meta-row"><span className="unit-meta-label">MAC</span><span className="unit-meta-val">{info.unitA ? info.unitA.mac : '—'}</span></div>
                {info.unitA && info.unitA.ip && <div className="unit-meta-row"><span className="unit-meta-label">IP</span><span className="unit-meta-val ip">{info.unitA.ip}</span></div>}
                {info.unitA && info.unitA.port && <div className="unit-meta-row"><span className="unit-meta-label">Port</span><span className="unit-meta-val">{info.unitA.port}</span></div>}
                {info.unitA && info.unitA.transport && <div className="unit-meta-row"><span className="unit-meta-label">Link</span><span className="unit-meta-val transport">{info.unitA.transport}</span></div>}
              </div>
            </div>
          </div>
          
          {/* Collapsible color control */}
          <div 
            className="color-toggle" 
            onClick={() => setColorExpanded(prev => ({ ...prev, a: !prev.a }))}
          >
            <div className="color-toggle-indicator" style={{ background: colors.a }} />
            <span>LED Color</span>
            <span style={{ marginLeft: 'auto', fontSize: '.7rem' }}>
              {colorExpanded.a ? '▼' : '▶'}
            </span>
          </div>
          
          <div className={'color-section' + (colorExpanded.a ? ' open' : '')}>
            <ColorPicker hex={colors.a} onChange={handleColorA} disabled={false} />
            <button className="send-btn" disabled={busyA} onClick={handleSendA}>
              Send to Unit A
            </button>
            <button className="off-btn" disabled={busyA} onClick={() => sendColor('a', 0, 0, 0, setBusyA, setStatusA)}>
              Turn OFF
            </button>
            <div className={'status ' + (statusA ? (statusA.ok ? 'ok' : 'err') : '')}>
              {statusA ? statusA.msg : ''}
            </div>
          </div>
          
          <TempBadge 
            data={tempA} 
            offset={offsets.a} 
            unitId="a"
            calibratedTempC={tempA ? applyCalibratedTemp('a', tempA.temp_c) : null}
          />
          <TempOffset value={offsets.a} onChange={v => setOffset('a', v)} />
        </div>

        {/* ── UNIT B ── */}
        <div className={`unit ${!unitAReachable ? 'alert' : ''}`}>
          {!unitAReachable && (
            <div className="unit-alert-banner">
              <span className="unit-alert-icon">⚠️</span>
              <span>Unit A must be active</span>
            </div>
          )}
          <div className="unit-header">
            <div className="unit-swatch" style={{ background: colors.b }} />
            <div>
              <div className="unit-label">
                Unit B
                <span className="unit-role-chip">{info.unitB ? info.unitB.role : 'sensor'}</span>
              </div>
              <div className="unit-sensor-chip">{info.unitB ? info.unitB.sensor : UNIT_SENSORS.b}</div>
              <div className="unit-meta">
                <div className="unit-meta-row"><span className="unit-meta-label">MAC</span><span className="unit-meta-val">{info.unitB ? info.unitB.mac : '—'}</span></div>
                {info.unitB && info.unitB.port && <div className="unit-meta-row"><span className="unit-meta-label">Port</span><span className="unit-meta-val">{info.unitB.port}</span></div>}
                {info.unitB && info.unitB.transport && <div className="unit-meta-row"><span className="unit-meta-label">Link</span><span className="unit-meta-val transport">{info.unitB.transport}</span></div>}
              </div>
            </div>
          </div>
          <div className="mode-row">
            <label>
              <input type="radio" name="modeB" value="match"
                     checked={modeB === 'match'}
                     onChange={() => dispatch({ type: 'MODE_B', mode: 'match' })} />
              Match A
            </label>
            <label>
              <input type="radio" name="modeB" value="independent"
                     checked={modeB === 'independent'}
                     onChange={() => dispatch({ type: 'MODE_B', mode: 'independent' })} />
              Independent
            </label>
          </div>
          
          {/* Collapsible color control */}
          <div 
            className="color-toggle" 
            onClick={() => setColorExpanded(prev => ({ ...prev, b: !prev.b }))}
          >
            <div className="color-toggle-indicator" style={{ background: colors.b }} />
            <span>LED Color</span>
            <span style={{ marginLeft: 'auto', fontSize: '.7rem' }}>
              {colorExpanded.b ? '▼' : '▶'}
            </span>
          </div>
          
          <div className={'color-section' + (colorExpanded.b ? ' open' : '')}>
            <ColorPicker hex={colors.b}
                         onChange={hex => dispatch({ type: 'COLOR', unit: 'b', hex })}
                         disabled={modeB === 'match'} />
            <button className="send-btn"
                    disabled={busyB || modeB !== 'independent'}
                    onClick={() => { const {r,g,b} = hexToRgb(colors.b); sendColor('b',r,g,b,setBusyB,setStatusB); }}>
              Send to Unit B
            </button>
            <button className="off-btn"
                    disabled={busyB || modeB !== 'independent'}
                    onClick={() => sendColor('b', 0, 0, 0, setBusyB, setStatusB)}>
              Turn OFF
            </button>
            <div className={'status ' + (statusB ? (statusB.ok ? 'ok' : 'err') : '')}>
              {statusB ? statusB.msg : ''}
            </div>
          </div>
          
          <TempBadge 
            data={tempB} 
            offset={offsets.b} 
            unitId="b"
            calibratedTempC={tempB ? applyCalibratedTemp('b', tempB.temp_c) : null}
          />
          <TempOffset value={offsets.b} onChange={v => setOffset('b', v)} />
        </div>

        {/* ── UNIT C ── */}
        <div className={`unit ${!unitAReachable ? 'alert' : ''}`}>
          {!unitAReachable && (
            <div className="unit-alert-banner">
              <span className="unit-alert-icon">⚠️</span>
              <span>Unit A must be active</span>
            </div>
          )}
          <div className="unit-header">
            <div className="unit-swatch" style={{ background: colors.c }} />
            <div>
              <div className="unit-label">
                Unit C
                <span className="unit-role-chip">{info.unitC ? info.unitC.role : 'sensor'}</span>
              </div>
              <div className="unit-sensor-chip">{info.unitC ? info.unitC.sensor : UNIT_SENSORS.c}</div>
              <div className="unit-meta">
                <div className="unit-meta-row"><span className="unit-meta-label">MAC</span><span className="unit-meta-val">{info.unitC ? info.unitC.mac : '—'}</span></div>
                {info.unitC && info.unitC.port && <div className="unit-meta-row"><span className="unit-meta-label">Port</span><span className="unit-meta-val">{info.unitC.port}</span></div>}
                {info.unitC && info.unitC.transport && <div className="unit-meta-row"><span className="unit-meta-label">Link</span><span className="unit-meta-val transport">{info.unitC.transport}</span></div>}
              </div>
            </div>
          </div>
          <div className="mode-row">
            <label>
              <input type="radio" name="modeC" value="match"
                     checked={modeC === 'match'}
                     onChange={() => dispatch({ type: 'MODE_C', mode: 'match' })} />
              Match A
            </label>
            <label>
              <input type="radio" name="modeC" value="independent"
                     checked={modeC === 'independent'}
                     onChange={() => dispatch({ type: 'MODE_C', mode: 'independent' })} />
              Independent
            </label>
          </div>
          
          {/* Collapsible color control */}
          <div 
            className="color-toggle" 
            onClick={() => setColorExpanded(prev => ({ ...prev, c: !prev.c }))}
          >
            <div className="color-toggle-indicator" style={{ background: colors.c }} />
            <span>LED Color</span>
            <span style={{ marginLeft: 'auto', fontSize: '.7rem' }}>
              {colorExpanded.c ? '▼' : '▶'}
            </span>
          </div>
          
          <div className={'color-section' + (colorExpanded.c ? ' open' : '')}>
            <ColorPicker hex={colors.c}
                         onChange={hex => dispatch({ type: 'COLOR', unit: 'c', hex })}
                         disabled={modeC === 'match'} />
            <button className="send-btn"
                    disabled={busyC || modeC !== 'independent'}
                    onClick={() => { const {r,g,b} = hexToRgb(colors.c); sendColor('c',r,g,b,setBusyC,setStatusC); }}>
              Send to Unit C
            </button>
            <button className="off-btn"
                    disabled={busyC || modeC !== 'independent'}
                    onClick={() => sendColor('c', 0, 0, 0, setBusyC, setStatusC)}>
              Turn OFF
            </button>
            <div className={'status ' + (statusC ? (statusC.ok ? 'ok' : 'err') : '')}>
              {statusC ? statusC.msg : ''}
            </div>
          </div>
          
          <TempBadge 
            data={tempC} 
            offset={offsets.c} 
            unitId="c"
            calibratedTempC={tempC ? applyCalibratedTemp('c', tempC.temp_c) : null}
          />
          <TempOffset value={offsets.c} onChange={v => setOffset('c', v)} />
        </div>

          </div> {/* end grid */}
        </div> {/* end controls tab */}

        {/* ── TEMPERATURE GRAPH TAB ── */}
        <div className={'tab-panel' + (activeTab === 'graph' ? ' active' : '')}>
          <TemperatureGraph history={state.tempHistory} />
        </div>

        {/* ── CALIBRATION TAB ── */}
        <div className={'tab-panel' + (activeTab === 'calibration' ? ' active' : '')}>
          <CalibrationPanel />
        </div>

        {/* ── ACTIVITY LOG TAB ── */}
        <div className={'tab-panel' + (activeTab === 'log' ? ' active' : '')}>
          <ActivityLog entries={log} />
        </div>
      </div>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
